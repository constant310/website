m0-5v5h5M4 13a8 8 0 0 0 14 5l2-2m0 5v-5h-5"/>',shield:'<path d="m12 2 8 4v6c0 5-3.5 8-8 10-4.5-2-8-5-8-10V6z"/><path d="m9 12 2 2 4-4"/>',bank:'<path d="m3 9 9-6 9 6H3zM5 10v9M10 10v9M14 10v9M19 10v9M3 21h18"/>',activity:'<path d="M3 12h4l3-7 4 14 3-7h4"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 11h18"/>',receipt:'<path d="M5 3h14v18l-3-2-4 2-4-2-3 2V3zM8 8h8M8 12h8"/>',back:'<path d="m15 18-6-6 6-6"/>'};
const ico=(name,size=18)=>`<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[name]||I.info}</svg>`;

const num=n=>Number.isFinite(+n)?+n:0;

const ident=(prefix='CB')=>`${prefix}-${Date.now().toString(36).slice(-6).toUpperCase()}-${Math.floor(Math.random()*900+100)}`;
const configs={truetrust:{name:'True Trust Multipurpose Cooperative',short:'True Trust',place:'Effurun · Warri',prefix:'TT'},desire:{name:'Desire Youth Multipurpose Cooperative',short:'Desire Youth',place:'Ogunu · Warri',prefix:'DY'}};
const names=['Amaka Okafor','Chinedu Efe','Blessing Oghene','Tega Osagie','Emeka Nwosu','Vivian Ovie','Samuel Aghogho','Rita Ibru','Daniel Edafe','Gloria Ufuoma','Favour Oboro','Michael Edeki'];
function seed(org){const cf=configs[org],members=names.map((name,i)=>({id:`${cf.prefix}-${String(i+1).padStart(3,'0')}`,name,phone:'0800 000 '+String(1000+i),plan:i%3===0?'Daily Thrift':i%3===1?'Weekly Savings':'Monthly Savings',wallet:[18500,62000,4000,38000,15000,78000,7500,22000,12500,50000,1800,91000][i],savings:[210000,145000,85000,320000,275000,192000,135000,66000,240000,184000,55000,305000][i],shares:[10000,10000,20000,10000,30000,10000,10000,10000,25000,10000,5000,25000][i],status:i===11?'Pending':'Active',joined:`2026-${String(2+(i%7)).padStart(2,'0')}-${String(10+(i%14)).padStart(2,'0')}`}));const transactions=members.slice(0,10).map((m,i)=>({id:`TRX-${cf.prefix}-${String(100+i)}`,memberId:m.id,type:i%2?'Savings contribution':'Wallet funding',amount:5000+(i%4)*5000,kind:i%2?'out':'in',status:'Completed',date:`2026-10-${String(20-Math.floor(i/2)).padStart(2,'0')}`,memo:'Sample historical entry'}));return{members,transactions,loans:[{id:`LN-${cf.prefix}-081`,memberId:members[1].id,amount:150000,remaining:110000,term:6,guarantor:members[3].name,purpose:'Business expansion',status:'Disbursed',date:'2026-09-12'},{id:`LN-${cf.prefix}-082`,memberId:members[4].id,amount:90000,remaining:90000,term:4,guarantor:members[2].name,purpose:'School fees',status:'Pending',date:'2026-10-18'},{id:`LN-${cf.prefix}-083`,memberId:members[7].id,amount:250000,remaining:250000,term:12,guarantor:members[5].name,purpose:'Small business capital',status:'Treasurer approved',date:'2026-10-19'}],withdrawals:[{id:`WD-${cf.prefix}-021`,memberId:members[2].id,amount:3000,bank:'Member bank account (sample)',status:'Pending',date:'2026-10-20'}],deposits:[],audit:[{id:'A1',event:'Demo workspace initialised',actor:'Demo system',at:'2026-10-20 09:00'}],settings:{weekly:10000,monthly:30000,share:10000},partnerShare:250,pilotMembers:200,memberIndex:0}};
let actorRole="Operations";
let db={};try{db=JSON.parse(localStorage.getItem('coopbridge_prospect_v7_ng')||'{}')}catch{}
for(const k of Object.keys(configs))if(!db[k]||!Array.isArray(db[k].members))db[k]=seed(k);
const query=new URLSearchParams(location.search);let org=query.get('org')==='desire'?'desire':'truetrust',role='admin',page='overview',filter='',loanTab='all',memberPage='home',drawer=false;
function d(){return db[org]}
function requireOfficer(which){if(role!=='admin'||actorRole!==which){toast(`Switch to the ${which} officer to complete this stage.`,true);return false}return true}
function ownMember(id){if(role==='member'&&member().id!==id){toast('Members may only operate their own sample account.',true);return false}return true}

function demoStep(title,description,action,label){return `<div class="journey-step"><span class="journey-check">${ico('check')}</span><div><b>${title}</b><p>${description}</p></div>${btn(label,action,'btn btn-xs btn-primary','arrow')}</div>`}
function journeyPage(){const a=d(),open=a.deposits.filter(x=>x.status==='Awaiting confirmation').length,guar=a.loans.filter(x=>x.status==='Guarantor pending').length,waiting=a.loans.filter(x=>['Pending','Treasurer approved','Approved'].includes(x.status)).length;return `${header('A full cooperative journey','Follow an actual sequence of actions, with separate sample roles and updated records.',btn('Reset demo to beginning','resetDemo()','btn btn-soft','refresh'),'GUIDED DEMONSTRATION')}${journeyNotice}<div class="kpi-grid">${stat('Pending bank references',open,'Ready for treasurer reconciliation','bank')}${stat('Guarantor requests',guar,'Member consent step','users','blue')}${stat('Loans in workflow',waiting,'Review → approval → payout','loans','amber')}${stat('Audit trail events',a.audit.length,'Updated with each action','report','rose')}</div><div class="two-col">${panel('Walkthrough · member journey','Perform each step, then return to this page.',demoStep('01 · Enrol a member','Operations captures member details and approves the profile.',"actorRole='Operations';navigate('members')",'Members')+demoStep('02 · Member makes a funding request','Switch to Member and create a transfer reference. It starts Pending.',"switchRole('member');navigate('mywallet')",'Member wallet')+demoStep('03 · Treasurer reconciles payment','Switch to Treasurer to confirm a unique mock provider payment event. The wallet increases once.',"actorRole='Treasurer';switchRole('admin');navigate('wallets')",'Reconcile')+demoStep('04 · Allocate money to thrift or shares','Member chooses contribution plan; the wallet decreases and savings increase.',"switchRole('member');navigate('mysavings')",'Contribute')+demoStep('05 · Submit a loan and obtain guarantor consent','A different member accepts the guarantee before officers review.',"switchRole('member');navigate('myloans')",'Request loan'))}${panel('Walkthrough · controls & decisions','Follow the hand-offs and produce an auditable report.',demoStep('06 · Treasurer reviews request','Checks guarantor acceptance and recommends a loan.',"setOfficer('Treasurer')",'Review')+demoStep('07 · Chairman authorises','An independent role approves the recommended loan.',"setOfficer('Chairman')",'Authorise')+demoStep('08 · Treasurer stages disbursement','Treasurer completes a simulated wallet credit after approval.',"setOfficer('Treasurer')",'Disburse')+demoStep('09 · Repayment and statement','Switch to Member, repay from available wallet and download statement.',"switchRole('member');navigate('myloans')",'Repay')+demoStep('10 · Reports and commercial proposal','Review transaction and audit records, then proposed ₦500/member fee.',"actorRole='Operations';navigate('reports')",'Reports'))}</div><div class="pitch-banner" style="margin-top:18px"><div><h3>Two potential partner workspaces</h3><p>Switch between True Trust and Desire Youth at the top. Their fictional member data remains separate in this browser.</p></div>${btn('Open proposed revenue model',"navigate('partnership')",'btn btn-primary','arrow')}</div>`}

function person(m,i=0){return `<div class="person">${avatar(m.name,i)}<div><b>${E(m.name)}</b><span>${E(m.id)}</span></div></div>`}
function transactionRow(t){let m=mById(t.memberId);return `<tr><td><strong>${E(t.id)}</strong><div class="muted" style="font-size:10px">${E(t.date)}</div></td><td>${m?E(m.name):'—'}</td><td>${E(t.type)}</td><td class="${t.kind==='in'?'amount-pos':'amount-neg'}">${t.kind==='in'?'+':'−'}${fmt(t.amount)}</td><td>${badge(t.status)}</td><td>${btn('Receipt',`receipt('${t.id}')`,'btn btn-xs')}</td></tr>`}
function table(head,body){return `<div class="table-wrap"><table class="table"><thead><tr>${head.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${body||`<tr><td colspan="${head.length}" class="empty">Nothing here yet. Try an action in the demo.</td></tr>`}</tbody></table></div>`}
function panel(title,sub,body,action=''){return `<section class="panel"><div class="panel-header"><div><h3>${title}</h3>${sub?`<p class="subtitle">${sub}</p>`:''}</div>${action}</div>${body}</section>`}
function btn(text,action,cls='btn',iconName=''){return `<button type="button" class="${cls}" onclick="${action}">${iconName?ico(iconName):''}${text}</button>`}
function header(title,sub,action='',eyebrow='OPERATIONS WORKSPACE'){return `<div class="page-head"><div><div class="eyebrow">${eyebrow}</div><h2>${title}</h2><p>${sub}</p></div>${action?`<div class="head-actions">${action}</div>`:''}</div>`}
const journeyNotice='<div class="demo-bar">'+ico('shield')+'<div><b>REAL-WORLD WORKFLOW, SIMULATED FUNDS:</b> Separate officer stages, member consent, wallet settlement and statements are demonstrated with fictional data. Authentication, Paystack payment, real banking and ledger security need a production backend.</div></div>';
const notice=`<div class="demo-bar">${ico('info')}<div><b>INTERACTIVE DEMO — FICTIONAL DATA.</b> All wallet-style balances, account details, payments, confirmations and approvals are simulated. No real banking, Paystack API connection or member accounts are active.</div></div>`;
function renderSide(){const navs=role==='admin'?adminNav:memberNav;return `<div class="overlay ${drawer?'open':''}" onclick="drawer=false;render()"></div><aside class="sidebar ${drawer?'open':''}"><div class="brand"><div class="mark">◈</div><div><h1>coopbridge.</h1><span>Nigeria-ready · Paystack demo</span></div></div><div class="nav-group">${role==='admin'?'MANAGEMENT SUITE':'MEMBER SPACE'}</div><nav class="side-nav">${navs.map(([id,title,icon])=>`<button class="nav-button ${page===id?'active':''}" onclick="navigate('${id}')">${ico(icon)}${title}${id==='approvals'&&countPending()?`<small>${countPending()}</small>`:''}</button>`).join('')}</nav><div class="side-foot"><div class="mini-card"><h4>Paystack checkout demonstration</h4><p>Experience payments and approvals with fictional records. No live money.</p><button onclick="navigate('${role==='admin'?'paystack':'mypayments'}')">Open payments →</button></div></div></aside>`}
function countPending(){return d().loans.filter(l=>['Pending','Treasurer approved','Approved'].includes(l.status)).length+d().withdrawals.filter(w=>['Pending','Treasurer approved','Approved'].includes(w.status)).length+d().deposits.filter(w=>w.status==='Awaiting confirmation').length}
function renderTop(){const off=role==='admin'?`<select aria-label="Active demo officer" id="officer-select" class="field-mini" onchange="actorRole=this.value;render()"><option value="Operations" ${actorRole==='Operations'?'selected':''}>Operations officer</option><option value="Treasurer" ${actorRole==='Treasurer'?'selected':''}>Treasurer</option><option value="Chairman" ${actorRole==='Chairman'?'selected':''}>Chairman</option></select>`:`<select aria-label="Active sample member" id="demo-member-select" class="field-mini" onchange="d().memberIndex=+this.value;save();render()">${d().members.map((m,i)=>`<option value="${i}" ${i===d().memberIndex?'selected':''}>${E(m.name)}</option>`).join('')}</select>`;return `<div class="topbar"><button class="circle-btn mobile-menu" onclick="drawer=!drawer;render()" aria-label="Toggle menu">${ico('menu')}</button><div class="crumb">Workspace <span> / </span> ${role==='admin'?'Management':'Member'} <span> / </span><strong>${E((role==='admin'?adminNav:memberNav).find(x=>x[0]===page)?.[1]||'Overview')}</strong></div><div class="top-right"><select aria-label="Cooperative" class="field-mini" onchange="changeOrg(this.value)"><option value="truetrust" ${org==='truetrust'?'selected':''}>True Trust</option><option value="desire" ${org==='desire'?'selected':''}>Desire Youth</option></select>${off}<div class="role-switch"><button class="${role==='admin'?'active':''}" onclick="switchRole('admin')">Manager</button><button class="${role==='member'?'active':''}" onclick="switchRole('member')">Member</button></div></div></div>`}
function render(){const mapping={paystack:paystackDeskPage,mypayments:memberPaystackPage,nigeria:nigeriaPage,collections:collectionsPage,risk:riskPage,supportdesk:supportDeskPage,mydues:myDuesPage,myhelp:myHelpPage,journey:journeyPage,overview:overview,members:membersPage,wallets:walletsPage,savings:savingsPage,loans:loansPage,approvals:approvalsPage,transactions:transactionsPage,reports:reportsPage,partnership:partnershipPage,settings:settingsPage,home:memberHome,mywallet:memberWallet,mysavings:memberSavings,myloans:memberLoans,myactivity:memberActivity,myprofile:memberProfile};$('#app').innerHTML=`<div class="app">${renderSide()}<main class="content">${renderTop()}${role==='admin'?`<div class="officer-banner">${ico('shield')} <b>Demo role: ${E(actorRole)}</b><span>Switch officer above to demonstrate separate authorisation stages.</span>${btn('Guided demo',"navigate('journey')",'btn btn-xs btn-soft')}</div>`:''}${(mapping[page]||overview)()}<div class="footline">CoopBridge · Interactive product concept · All examples, accounts, payments and figures are simulated · © 2026 · Nigeria pilot v3</div>${mobileNav()}</main></div>`;const q=$('#search-input');if(q){q.focus();q.setSelectionRange(q.value.length,q.value.length)}}
function searchRows(field,val){filter=val;const el=$('#table-body');if(!el)return;el.innerHTML=(field==='members'?renderMembersRows():field==='transactions'?renderTransactionRows():renderWalletRows())}
function overview(){let ds=d(),sum=ds.members.reduce((a,m)=>a+m.savings,0),wallet=ds.members.reduce((a,m)=>a+m.wallet,0),loans=ds.loans.filter(l=>l.status==='Disbursed').reduce((a,l)=>a+l.remaining,0),active=ds.members.filter(m=>m.status==='Active').length;const chart=[57,70,62,85,75,94,81].map((h,i)=>`<div class="bar-col"><div class="bar-pair"><div class="bar" style="height:${h}%"></div><div class="bar alt" style="height:${h*.62}%"></div></div><small>${['Apr','May','Jun','Jul','Aug','Sep','Oct'][i]}</small></div>`).join('');return `${header(`Good afternoon, Cooperative Team 👋`,`A clearer picture of ${E(configs[org].short)}'s sample finances and operations.`,btn('Record contribution',"openAllocate('')",'btn btn-primary','plus'))}${notice}<div class="ng-screen-notice"><b>New Nigerian workflow lab:</b> Learn how the cooperative handles cash/POS settlements, wrong transfer references, arrears, payment disputes and members without smartphones. ${btn('Explore 12 realistic cases',"navigate('nigeria')",'btn btn-xs btn-primary')}</div><div class="kpi-grid">${stat('Total member savings',fmt(sum),'<span class="trend">Demo ledger</span> · 12 sample profiles','coins')}${stat('Wallet balances',fmt(wallet),'Available for allocation · demo only','wallet','blue')}${stat('Outstanding loan principal',fmt(loans),'Across simulated disbursed loans','loans','amber')}${stat('Member records',String(ds.members.length),`${active} active · ${ds.members.length-active} pending`,'users','rose')}</div><div class="dash-grid">${panel('Contribution activity','Illustrative trend · not actual historical data',`<div class="visual-bars">${chart}</div><div class="legend"><span><i></i> Savings inflows</span><span><i class="alt"></i> Scheduled contributions</span></div>`,`<span class="month-badge">7-month illustration</span>`)}${panel('Needs your attention','Actions you can complete in the demo',`<div class="task"><span class="glyph amber">${ico('loans')}</span><div><div class="title">Loan applications</div><div class="info">Treasurer and chairman approval workflow</div></div><div class="trailing">${ds.loans.filter(l=>['Guarantor pending','Pending','Treasurer approved'].includes(l.status)).length}</div></div><div class="task"><span class="glyph blue">${ico('wallet')}</span><div><div class="title">Withdrawal requests</div><div class="info">Review and simulated settlement</div></div><div class="trailing">${ds.withdrawals.filter(x=>x.status!=='Completed'&&x.status!=='Rejected').length}</div></div><div class="task"><span class="glyph">${ico('bank')}</span><div><div class="title">Bank transfer matching</div><div class="info">Awaiting demo confirmation</div></div><div class="trailing">${ds.deposits.filter(x=>x.status==='Awaiting confirmation').length}</div></div>${btn('Review pending requests',"navigate('approvals')",'btn btn-soft large-cta','arrow')}`)} </div><div class="section-grid">${panel('Recent ledger activity','Latest sample transactions',table(['Reference','Member','Description','Amount','Status',''],ds.transactions.slice(0,5).map(transactionRow).join('')),btn('View all',"navigate('transactions')",'btn btn-xs'))}${panel('One cooperative. One platform.','A complete journey from collection to reporting',`<div class="flow-steps"><div class="flow-step"><div class="num">1</div><strong>Collect</strong><small>Simulated bank transfer funding</small></div><div class="flow-step"><div class="num">2</div><strong>Allocate</strong><small>Wallet funds to savings plans</small></div><div class="flow-step"><div class="num">3</div><strong>Approve</strong><small>Loans and withdrawals in stages</small></div><div class="flow-step"><div class="num">4</div><strong>Report</strong><small>Export ledger and management data</small></div></div><div style="margin-top:17px">${btn('Start wallet walkthrough',"navigate('wallets')",'btn btn-primary','arrow')}</div>`)}</div>`}
function renderMembersRows(){let rows=d().members.filter(m=>(m.name+' '+m.id+' '+m.plan).toLowerCase().includes(filter.toLowerCase()));return rows.map((m,i)=>`<tr><td>${person(m,i)}</td><td>${E(m.plan)}</td><td><b>${fmt(m.savings)}</b></td><td>${fmt(m.wallet)}</td><td>${badge(m.status)}</td><td>${btn('Open',`showMember('${m.id}')`,'btn btn-xs')}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">No matching members</td></tr>'}
function membersPage(){return `${header('Member management','Keep registrations, contribution plans, member statements and verification steps organised.',btn('Add member',"addMember()",'btn btn-primary','plus'))}${notice}<div class="kpi-grid">${stat('Total members',d().members.length,'Across this demonstration society','users')}${stat('Active profiles',d().members.filter(m=>m.status==='Active').length,'Sample verified membership','shield','blue')}${stat('Pending review',d().members.filter(m=>m.status==='Pending').length,'Awaiting simulated approval','clock','amber')}${stat('Contribution plans',3,'Daily, weekly and monthly examples','calendar','rose')}</div>${panel('Member directory','Search and open a profile, approve a member or post a contribution',`<div class="toolbar"><div class="search">${ico('search')}<input id="search-input" placeholder="Search name, member number or plan" value="${E(filter)}" oninput="searchRows('members',this.value)"></div>${btn('Export member CSV','exportCSV("members")','btn','download')}</div><div class="table-wrap"><table class="table"><thead><tr><th>Member</th><th>Plan</th><th>Savings</th><th>Wallet</th><th>Status</th><th></th></tr></thead><tbody id="table-body">${renderMembersRows()}</tbody></table></div>`)}`}
function renderWalletRows(){return d().members.filter(m=>(m.name+' '+m.id).toLowerCase().includes(filter.toLowerCase())).map((m,i)=>`<tr><td>${person(m,i)}</td><td><b>${fmt(m.wallet)}</b></td><td>${fmt(m.savings)}</td><td><span class="badge-outline">${org==='desire'?'DY':'TT'}-DEMO-${String(i+1).padStart(3,'0')}</span></td><td>${btn('View',`walletDetail('${m.id}')`,'btn btn-xs')}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">No matching wallets</td></tr>'}
function walletsPage(){let total=d().members.reduce((s,m)=>s+m.wallet,0);return `${header('Wallets & collections','Demonstrate the staged journey from Paystack checkout to verified internal ledger posting.',btn('Paystack test checkout',"openDeposit()",'btn btn-primary','plus'))}${notice}<div class="two-col" style="margin-bottom:18px"><div class="wallet-card"><small>Member wallet ledger total · illustrative</small><div class="huge">${fmt(total)}</div><small>Internal cooperative ledger balances — NOT bank deposit accounts</small><div class="wallet-actions"><button onclick="openDeposit()">+ Paystack test checkout</button><button onclick="openAllocate('')">Allocate to savings</button><button onclick="openWithdrawal('')">Withdrawal request</button></div></div>${panel('Paystack integration path','Planned production component, not connected in this prototype',`<div class="task"><span class="glyph blue">${ico('bank')}</span><div><div class="title">Hosted card / bank / USSD checkout</div><div class="info">Requires approved Paystack business account and secure backend</div></div>${badge('Planned')}</div><div class="task"><span class="glyph">${ico('check')}</span><div><div class="title">Webhook verification & matching</div><div class="info">Only confirmed references may update real ledgers</div></div>${badge('Planned')}</div><div class="task"><span class="glyph amber">${ico('shield')}</span><div><div class="title">Withdrawal authorisation</div><div class="info">Dual approvals, limits and payouts</div></div>${badge('Planned')}</div>`)} </div>${panel('Member wallet register','Search any member to explore balances and staged account references',`<div class="toolbar"><div class="search">${ico('search')}<input id="search-input" placeholder="Search wallets by name" value="${E(filter)}" oninput="searchRows('wallets',this.value)"></div></div><div class="table-wrap"><table class="table"><thead><tr><th>Member</th><th>Available demo wallet</th><th>Savings ledger</th><th>Reference</th><th></th></tr></thead><tbody id="table-body">${renderWalletRows()}</tbody></table></div>`,btn('Create Paystack test payment',"openDeposit()",'btn btn-xs','plus'))}<div style="height:17px"></div>${panel('Simulated payment collection lifecycle','Each step is interactive and can be demonstrated with prospective clients',`<div class="flow-steps"><div class="flow-step"><div class="num">1</div><strong>Member receives payment instructions</strong><small>Demo-only payment collection reference; no payable account number</small></div><div class="flow-step"><div class="num">2</div><strong>Transfer is initiated</strong><small>Create a pending simulated incoming payment</small></div><div class="flow-step"><div class="num">3</div><strong>Webhook is verified</strong><small>Manually trigger a pretend bank confirmation once only</small></div><div class="flow-step"><div class="num">4</div><strong>Ledger updates</strong><small>Member can allocate the balance to savings</small></div></div><div style="margin-top:15px">${d().deposits.filter(x=>x.status==='Awaiting confirmation').map(x=>`<div class="task"><span class="glyph amber">${ico('clock')}</span><div><div class="title">${E(x.id)} · ${E(mById(x.memberId)?.name||'Member')}</div><div class="info">${fmt(x.amount)} · Awaiting demo event</div></div>${btn('Confirm mock webhook',`confirmDeposit('${x.id}')`,'btn btn-xs btn-primary')}</div>`).join('')||'<p class="note">No pending demo collection references. Create one using “Create Paystack test payment”.</p>'}</div>`)}`}
function savingsPage(){const ds=d(),total=ds.members.reduce((a,m)=>a+m.savings,0);return `${header('Contributions & thrift','Record savings, configure contribution schedules and view each member’s history.',btn('Allocate from wallet',"openAllocate('')",'btn btn-primary','plus'))}${notice}<div class="kpi-grid">${stat('Total savings ledger',fmt(total),'Sample member savings totals','coins')}${stat('Share capital',fmt(ds.members.reduce((a,m)=>a+m.shares,0)),'Sample member share capital','bank','blue')}${stat('Weekly plan',fmt(ds.settings.weekly),'Configurable in Settings','calendar','amber')}${stat('Savings transactions',ds.transactions.filter(x=>x.type.includes('Savings')||x.type.includes('Share')).length,'Ledger events recorded','receipt','rose')}</div>${panel('Savings ledger','Move funds from a member wallet into the cooperative savings ledger',table(['Reference','Member','Transaction','Amount','Status'],ds.transactions.filter(t=>/Savings|Share|contribution/i.test(t.type)).map(transactionRow).join('')),btn('Download CSV','exportCSV("transactions")','btn btn-xs','download'))}<div style="height:17px"></div><div class="pitch-banner"><div><h3>Every contribution is traceable</h3><p>Show exactly how a member's wallet changes when money is allocated to a thrift plan.</p></div>${btn('Try contribution flow',"openAllocate('')",'btn btn-primary')}</div>`}
function renderLoanRows(){let rows=d().loans.filter(l=>loanTab==='all'||l.status.toLowerCase()===loanTab);return rows.map(l=>`<tr><td><b>${E(l.id)}</b><div class="muted" style="font-size:10px">${E(l.date)}</div></td><td>${E(mById(l.memberId)?.name||'—')}</td><td><b>${fmt(l.amount)}</b></td><td>${fmt(l.remaining)}</td><td>${l.term} months</td><td>${badge(l.status)}</td><td>${btn('Review',`loanDetail('${l.id}')`,'btn btn-xs')}</td></tr>`).join('')||'<tr><td colspan="7" class="empty">No matching loans</td></tr>'}
function loansPage(){return `${header('Loan management','Applications, guarantors, two-stage approval, staged disbursement and repayment history.',btn('New loan application',"applyLoan('')",'btn btn-primary','plus'))}${notice}<div class="kpi-grid">${stat('Loan requests',d().loans.length,'All demonstration applications','loans')}${stat('Awaiting approval',d().loans.filter(l=>['Guarantor pending','Pending','Treasurer approved'].includes(l.status)).length,'Approval queue','clock','amber')}${stat('Outstanding principal',fmt(d().loans.filter(l=>l.status==='Disbursed').reduce((a,l)=>a+l.remaining,0)),'Not including interest or fees','wallet','blue')}${stat('Approved',d().loans.filter(l=>['Approved','Disbursed'].includes(l.status)).length,'Including disbursed cases','check','rose')}</div><div class="pill-tabs">${['all','guarantor pending','pending','treasurer approved','approved','disbursed','rejected'].map(n=>`<button class="${loanTab===n?'active':''}" onclick="loanTab='${n}';render()">${n==='all'?'All loans':n[0].toUpperCase()+n.slice(1)}</button>`).join('')}</div>${panel('Loan application register','Loan eligibility and guarantor validation must be configured before production launch',table(['Reference','Member','Requested','Principal due','Term','Status',''],renderLoanRows()),btn('Export loans','exportCSV("loans")','btn btn-xs','download'))}`}
function renderApprovals(){const loans=d().loans.filter(l=>['Guarantor pending','Pending','Treasurer approved','Approved'].includes(l.status)),ws=d().withdrawals.filter(w=>['Pending','Treasurer approved','Approved'].includes(w.status));let html='';for(const l of loans){let opts=l.status==='Guarantor pending'?btn('Awaiting member consent',`setMemberById('${l.guarantorId}')`,'btn btn-xs btn-soft','users'):l.status==='Pending'?btn('Treasurer recommendation',`loanAdvance('${l.id}')`,'btn btn-xs btn-primary','check')+btn('Decline',`rejectLoan('${l.id}')`,'btn btn-xs btn-red'):l.status==='Treasurer approved'?btn('Chairman authorisation',`loanAdvance('${l.id}')`,'btn btn-xs btn-primary','check')+btn('Decline',`rejectLoan('${l.id}')`,'btn btn-xs btn-red'):btn('Treasurer disburses',`loanAdvance('${l.id}')`,'btn btn-xs btn-primary','wallet');html+=`<div class="task"><span class="glyph blue">${ico('loans')}</span><div><div class="title">${E(mById(l.memberId)?.name||'Member')} · Loan ${fmt(l.amount)}</div><div class="info">${E(l.id)} · ${E(l.status)} · Guarantor: ${E(l.guarantor)}</div></div><div class="row-actions">${opts}</div></div>`}for(const w of ws){let opts=w.status==='Pending'?btn('Treasurer review',`withdrawAdvance('${w.id}')`,'btn btn-xs btn-primary'):w.status==='Treasurer approved'?btn('Chairman authorises',`withdrawAdvance('${w.id}')`,'btn btn-xs btn-primary'):btn('Treasurer settles',`withdrawAdvance('${w.id}')`,'btn btn-xs btn-primary');html+=`<div class="task"><span class="glyph amber">${ico('wallet')}</span><div><div class="title">${E(mById(w.memberId)?.name||'Member')} · Withdrawal ${fmt(w.amount)}</div><div class="info">${E(w.id)} · ${E(w.status)} · ${E(w.bank)}</div></div><div class="row-actions">${opts} ${btn('Reject',`rejectWithdrawal('${w.id}')`,'btn btn-xs btn-red')}</div></div>`}return html||`<p class="empty">No pending authorisations right now.</p>`}
function approvalsPage(){return `${header('Approvals centre','Demonstrate treasurer review, chairman authorisation and disbursement controls.')}${notice}<div class="two-col" style="margin-bottom:17px">${panel('Approval policy','Illustrative dual-control setup',`<div class="flow-steps" style="grid-template-columns:repeat(3,1fr)"><div class="flow-step"><div class="num">1</div><strong>Submit</strong><small>Member request</small></div><div class="flow-step"><div class="num">2</div><strong>Treasurer</strong><small>Review and validate</small></div><div class="flow-step"><div class="num">3</div><strong>Chairman</strong><small>Authorise settlement</small></div></div><p class="note">The selected demo officer represents a role; production must authenticate individual people and enforce separation of duties on the server.</p>`)}${panel('Access safeguards','Production obligations',`<div class="task">${ico('shield')}<div><div class="title">Different authorised officer identities</div><div class="info">Server-enforced separation of duties</div></div></div><div class="task">${ico('receipt')}<div><div class="title">Immutable transaction trail</div><div class="info">Reversals with explicit audit events</div></div></div><div class="task">${ico('bank')}<div><div class="title">Verified payout statuses</div><div class="info">Check banking provider response, never trust browser confirmation</div></div></div>`)} </div>${panel('Requests waiting for action',`${countPending()} open workflow items`,renderApprovals())}`}
function renderTransactionRows(){let rows=d().transactions.filter(t=>(`${t.id} ${t.type} ${mById(t.memberId)?.name||''}`).toLowerCase().includes(filter.toLowerCase()));return rows.map(transactionRow).join('')||'<tr><td colspan="5" class="empty">No matching transactions</td></tr>'}
function transactionsPage(){return `${header('Transaction ledger','Browse wallet inflows, savings allocations, repayments and recorded transfers.',btn('Export CSV','exportCSV("transactions")','btn btn-primary','download'))}${notice}${panel('All ledger entries','Sample data in this browser only',`<div class="toolbar"><div class="search">${ico('search')}<input id="search-input" placeholder="Search by member, reference or description" value="${E(filter)}" oninput="searchRows('transactions',this.value)"></div></div><div class="table-wrap"><table class="table"><thead><tr><th>Reference</th><th>Member</th><th>Transaction</th><th>Amount</th><th>Status</th></tr></thead><tbody id="table-body">${renderTransactionRows()}</tbody></table></div>`)}`}
function reportsPage(){let ds=d(),total=ds.members.reduce((a,m)=>a+m.savings,0),wallet=ds.members.reduce((a,m)=>a+m.wallet,0);return `${header('Reports & audit trail','A reporting centre for the treasurer, secretary, finance team and executive committee.',btn('Export full report',"exportCSV('report')",'btn btn-primary','download'))}${notice}<div class="kpi-grid">${stat('Savings liability',fmt(total),'Amount owed to members in savings','coins')}${stat('Wallet liability',fmt(wallet),'Available member balances','wallet','blue')}${stat('Loan receivables',fmt(ds.loans.filter(x=>x.status==='Disbursed').reduce((a,l)=>a+l.remaining,0)),'Outstanding principal','loans','amber')}${stat('Recorded events',ds.audit.length,'Sample audit entries','report','rose')}</div><div class="three-col" style="margin-bottom:17px">${['members','transactions','loans'].map((what)=>`<div class="scenario"><strong>${what==='members'?'Member register':what==='transactions'?'Contribution & wallet ledger':'Loan book'}</strong><p>Download your illustrative ${what} data in CSV format for board discussion or analysis.</p>${btn('Export '+what,`exportCSV('${what}')`,'btn btn-xs','download')}</div>`).join('')}</div>${panel('Recent audit events','Browser-only demonstration trail; not immutable or tamper-proof',table(['Event','Actor','Time'],ds.audit.slice(0,25).map(a=>`<tr><td><b>${E(a.event)}</b></td><td>${E(a.actor)}</td><td>${E(a.at)}</td></tr>`).join('')))}<p class="note" style="margin-top:13px">Production accounting would need a double-entry ledger, bank reconciliation, server-side audit logging, export control and backup/recovery policy.</p>`}
function partnershipPage(){let ds=d(),n=ds.pilotMembers,share=ds.partnerShare,fee=500;return `${header('A partnership that creates value','A transparent, proposed ₦500/member monthly service model with cooperative participation.',btn('Print this view','window.print()','btn','receipt'),'PARTNERSHIP PROPOSAL')}${notice}<div class="proposal-box"><small>FOUNDING COOPERATIVE PARTNERSHIP · DISCUSSION DRAFT</small><h3>Modern member services.<br>Shared economic upside.</h3><p>Members access a digital account experience, while the cooperative gains better records, faster loan processing, reporting and a proposed share of subscription receipts. Financial terms, collection responsibility and legal treatment must be agreed before launch.</p></div><div class="panel" style="margin:17px 0"><div class="panel-header"><div><h3>Revenue scenario calculator</h3><p class="subtitle">Hypothetical economics only · not a bill or binding offer</p></div><span class="month-badge">Monthly illustration</span></div><div class="rate-control"><label><small class="muted">Paying members per month</small><br><input type="number" id="pilot-count" value="${n}" min="1" max="500000" onchange="setPilotCount(this.value)"></label><label><small class="muted">Cooperative share per paying member</small><br><select id="partner-share" onchange="setPartnerShare(this.value)"><option value="200" ${share===200?'selected':''}>₦200</option><option value="250" ${share===250?'selected':''}>₦250</option><option value="300" ${share===300?'selected':''}>₦300</option></select></label><div class="minor" style="align-self:flex-end;padding-bottom:10px">Total member charge: <b>₦500 / month</b></div></div><div class="kpi-grid" style="margin:20px 0 0">${stat('Gross member subscriptions',fmt(n*fee),`${n.toLocaleString()} × ₦500`,'users')}${stat('Proposed cooperative share',fmt(n*share),`${n.toLocaleString()} × ${fmt(share)}`,'hand','blue')}${stat('Platform share before costs',fmt(n*(fee-share)),'Before taxes, payment processing, support & overheads','wallet','amber')}${stat('Cooperative share per member',fmt(share),`Of the ₦500 monthly fee`,'coins','rose')}</div><p class="note" style="margin:16px 0 0"><strong>Commercial assumption:</strong> The ₦200–₦300 rebate is <strong>per paying member per month</strong>, not a flat ₦200–₦300 per cooperative. This calculator assumes all displayed members paid the service fee; unpaid, exempt and refunded charges are excluded in a real settlement report. The cooperative share would be contractually agreed, transparently disclosed, and subject to legal/regulatory review. The fee is NOT automatically debited from savings or wallets.</p></div><div class="two-col"><div class="panel"><h3>What the cooperative receives</h3><div class="timeline" style="margin-top:17px">${[['Digitised operations','Member onboarding, balances, savings plans and loan lifecycle.'],['Management visibility','Reports, approvals, financial snapshots and exportable records.'],['Better member experience','An accessible portal to view transactions, submit applications and track status.'],['Agreed revenue participation','A documented share of actually collected monthly subscription fees.']].map((x,i)=>`<div class="timeline-item"><div class="timeline-dot">${i+1}</div><div><strong>${x[0]}</strong><p>${x[1]}</p></div></div>`).join('')}</div></div><div class="panel"><h3>What we need to agree first</h3><div class="timeline" style="margin-top:17px">${[['Discovery meeting','Membership size, contribution products, existing spreadsheets/software and approval rules.'],['Pilot design','Limited number of consenting test members, features, dates and measurable success criteria.'],['Paystack & regulatory readiness','Confirm API eligibility, banking partner structure, licensing responsibilities and safeguarding of member funds.'],['Commercial contract','Fee payer, share, settlement schedule, taxes, refund rules, support and termination/data export.']].map((x,i)=>`<div class="timeline-item"><div class="timeline-dot">${i+1}</div><div><strong>${x[0]}</strong><p>${x[1]}</p></div></div>`).join('')}</div></div></div><div style="height:17px"></div><div class="ng-separator"></div><div class="panel"><div class="panel-header"><div><h3>How Nigerian members may react to a ₦500 monthly fee</h3><p class="subtitle">A sales hypothesis to validate with the cooperative — not market research findings</p></div><span class="ng-tag warning">Pilot recommendation</span></div><div class="ng-cards"><article class="ng-card"><h4>Member pays ₦500</h4><p>Low monthly price relative to some contribution plans, but members may ask why they must pay to access their own records. Explain the value and make the charge explicitly approved.</p></article><article class="ng-card"><h4>Cooperative sponsors access</h4><p>The cooperative pays for all or eligible members from its technology budget. This may increase access for members who do not use smartphones.</p></article><article class="ng-card"><h4>Hybrid pilot</h4><p>Start with voluntary users and a short cooperative-funded trial. Agree which features are free, who pays, exemption rules, and success measurements before charging.</p></article></div><p class="ng-mini">₦500/member/month is ₦6,000 annually. The cooperative's proposed ₦200–₦300 share and payment-provider charges require a written agreement. Do not auto-deduct service fees from savings without explicit authorisation and lawful terms. Confirm licensing obligations before issuing any regulated wallet or handling third-party funds.</p></div><div class="ng-separator"></div><div class="pitch-banner"><div><h3>The next conversation</h3><p>Propose a 20-minute discovery session and ask who manages operations, savings records and technical approvals.</p></div>${btn('Download partner summary',"exportCSV('economics')",'btn btn-primary','download')}</div>`}
function setPilotCount(n){let v=Math.max(1,Math.min(500000,Math.floor(Number(n)||1)));d().pilotMembers=v;save();render()}
function setPartnerShare(n){d().partnerShare=[200,250,300].includes(+n)?+n:250;save();render()}
function settingsPage(){let x=d().settings;return `${header('Cooperative configuration','Review plans, governance workflow and readiness steps for a production system.',btn('Reset this demo',"resetDemo()",'btn btn-red','refresh'))}${notice}<div class="two-col"><div class="panel"><div class="panel-header"><div><h3>Contribution plan configuration</h3><p class="subtitle">Demo amounts can be edited</p></div></div><div class="form-group"><label>Weekly thrift amount (₦)</label><input type="number" min="100" id="weekly" value="${x.weekly}"></div><div class="form-group"><label>Monthly savings amount (₦)</label><input type="number" min="100" id="monthly" value="${x.monthly}"></div><div class="form-group"><label>Default share capital (₦)</label><input type="number" min="100" id="shares" value="${x.share}"></div>${btn('Save demo configuration','saveSettings()','btn btn-primary','check')}</div><div class="panel"><h3>Governance & role concepts</h3><div style="margin-top:17px" class="settings-grid">${[['Chairman','Final authorised approvals'],['Treasurer','Review, reconcile and prepare reports'],['Secretary','Membership data and meeting records'],['Member','Own account information and requests']].map(([a,b])=>`<div class="settings-item"><b>${a}</b><p>${b}</p><small>Production role</small></div>`).join('')}</div><p class="note">Only a visual demonstration of roles. Real access control, authentication and permissions must be enforced in the backend.</p></div></div><div style="height:17px"></div>${panel('Production readiness checklist','Clear distinction between this concept and a real-money system',`<div class="settings-grid">${[['Multi-tenant security','Database with strict organisation isolation, authentication and member permissions.'],['Banking integration','Approved Paystack or another authorised banking solution, signed webhooks and reconciliation.'],['Financial accounting','Double-entry ledger, immutable events, reversals, interest and fee policies.'],['Approval controls','Verified dual authorisation for withdrawals, loans and payout limits.'],['Privacy & compliance','Data protection impact review, KYC/KYB and financial regulatory assessment.'],['Operations','Backup, monitoring, support SLAs, migration, disaster recovery and incident response.']].map(([a,b])=>`<div class="settings-item"><b>${a}</b><p>${b}</p><small>Required before going live</small></div>`).join('')}</div>`)}<div style="height:17px"></div>${panel('Recent workspace events','Every action you test is logged in this browser session',table(['Event','Actor','When'],d().audit.slice(0,10).map(a=>`<tr><td>${E(a.event)}</td><td>${E(a.actor)}</td><td>${E(a.at)}</td></tr>`).join('')))}`}
function memberHome(){let m=member();return `${header(`Welcome back, ${E(m.name.split(' ')[0])} 👋`,'Your savings, contributions and loan journey at a glance.',btn('Add money',"openDeposit('"+member().id+"')",'btn btn-primary','plus'),'YOUR COOPERATIVE ACCOUNT')}${notice}<div class="member-hero"><div><small style="color:#aedecb">Member workspace · ${E(configs[org].short)}</small><h2>${E(m.name)}</h2><p>${E(m.id)} · ${E(m.plan)} · sample profile</p></div>${avatar(m.name)}</div><div class="kpi-grid">${stat('Available wallet',fmt(m.wallet),'Demo money available for allocation','wallet')}${stat('Total savings',fmt(m.savings),'Your tracked cooperative savings','coins','blue')}${stat('Share capital',fmt(m.shares),'Separate cooperative shares','bank','amber')}${stat('My active loans',d().loans.filter(l=>l.memberId===m.id&&l.status==='Disbursed').length,'Outstanding loans','loans','rose')}</div><div class="two-col">${panel('Quick actions','Do more without visiting the cooperative office',`<div class="two-col">${btn('Fund wallet',`openDeposit('${m.id}')`,'btn btn-soft','plus')}${btn('Contribute to savings',`openAllocate('${m.id}')`,'btn btn-soft','coins')}${btn('Apply for a loan',`applyLoan('${m.id}')`,'btn btn-soft','loans')}${btn('Request withdrawal',`openWithdrawal('${m.id}')`,'btn btn-soft','wallet')}</div><div class="info-card" style="margin-top:16px"><strong>Your money stays under cooperative control</strong><p>This prototype uses fictional wallet figures. In production, account funding and payouts must be implemented through appropriately authorised financial partners and reconciled to the cooperative ledger.</p></div>`)}${panel('My recent activity','Sample wallet and contribution history',`<div>${d().transactions.filter(t=>t.memberId===m.id).slice(0,5).map(t=>`<div class="task"><span class="glyph">${ico('receipt')}</span><div><div class="title">${E(t.type)}</div><div class="info">${E(t.date)} · ${E(t.id)}</div></div><div class="trailing ${t.kind==='in'?'amount-pos':'amount-neg'}">${t.kind==='in'?'+':'−'}${fmt(t.amount)}</div></div>`).join('')||'<p class="note">No transactions yet. Fund a wallet or make a contribution to see the activity here.</p>'}</div>`)}</div>`}
function memberWallet(){let m=member();return `${header('My cooperative wallet','Track Paystack-funded contributions and internal savings allocations.',btn('Fund with Paystack',`startPaystack('${m.id}')`,'btn btn-primary','plus'),'MEMBER WALLET')}${notice}<div class="two-col" style="margin-bottom:18px"><div class="wallet-card"><small>Available ledger balance · sample</small><div class="huge">${fmt(m.wallet)}</div><small>${E(m.id)} · NOT a bank account</small><div class="wallet-actions"><button onclick="startPaystack('${m.id}')">+ Paystack</button><button onclick="openAllocate('${m.id}')">Contribute</button><button onclick="openWithdrawal('${m.id}')">Withdraw</button></div></div>${panel('Secure payments designed for Nigerians','Card, bank transfer or USSD via Paystack where supported',`<div class="ps-top"><b class="ps-logo">paystack</b><span class="ps-test">SANDBOX DEMO</span></div><div class="ng-steps"><span class="ng-step">Choose amount</span><span class="ng-step">Secure checkout</span><span class="ng-step">Payment reference</span><span class="ng-step">Verify before credit</span></div><p class="note" style="margin:14px 0">This is an internal cooperative ledger, not a regulated deposit wallet. The prototype never asks for actual card details.</p>${btn('Start test payment',`startPaystack('${m.id}')`,'btn btn-primary','plus')}`)}</div>${panel('Wallet movements','Only transactions for this sample member',table(['Reference','Event','Amount','Status'],d().transactions.filter(t=>t.memberId===m.id&&/wallet|withdraw|loan disbursement/i.test(t.type)).map(t=>`<tr><td>${E(t.id)}</td><td>${E(t.type)}</td><td class="${t.kind==='in'?'amount-pos':'amount-neg'}">${t.kind==='in'?'+':'−'}${fmt(t.amount)}</td><td>${badge(t.status)}</td></tr>`).join('')))}<div class="large-cta">${btn('See all Paystack transactions',"navigate('mypayments')",'btn btn-soft','arrow')}</div>`}
function memberSavings(){let m=member();return `${header('My savings','Track contribution plans and allocate your wallet funds.',btn('Make contribution',`openAllocate('${m.id}')`,'btn btn-primary','plus'),'MEMBER SAVINGS')}${notice}<div class="kpi-grid">${stat('Thrift savings',fmt(m.savings),'Current sample contribution ledger','coins')}${stat('Share capital',fmt(m.shares),'Member shares','bank','blue')}${stat('Wallet available',fmt(m.wallet),'Funds you can move to savings','wallet','amber')}${stat('Savings plan',E(m.plan),'Configured by your cooperative','calendar','rose')}</div>${panel('My contributions','Savings ledger events only',table(['Reference','Type','Amount','Status'],d().transactions.filter(t=>t.memberId===m.id&&/contribution|Savings/i.test(t.type)).map(t=>`<tr><td>${E(t.id)}</td><td>${E(t.type)}</td><td>${fmt(t.amount)}</td><td>${badge(t.status)}</td></tr>`).join('')))}<div style="height:17px"></div>${panel('How a contribution works','A contribution is an allocation, not a new incoming payment',`<div class="flow-steps"><div class="flow-step"><div class="num">1</div><strong>Fund wallet</strong><small>Incoming transfer is verified</small></div><div class="flow-step"><div class="num">2</div><strong>Select plan</strong><small>Choose thrift or share capital</small></div><div class="flow-step"><div class="num">3</div><strong>Transfer balance</strong><small>Wallet decreases, savings increases</small></div><div class="flow-step"><div class="num">4</div><strong>Receive proof</strong><small>History and CSV statement update</small></div></div>`)}`}
function memberLoans(){let m=member(),loans=d().loans.filter(l=>l.memberId===m.id);return `${header('My loan applications','Apply for credit, nominate a guarantor and track management approvals.',btn('Apply for loan',`applyLoan('${m.id}')`,'btn btn-primary','plus'),'MEMBER LOANS')}${notice}${guarantorInbox()}<div style="height:17px"></div><div class="three-col">${loans.map(l=>`<div class="loan-card"><div class="flex between">${badge(l.status)}<small class="muted">${E(l.id)}</small></div><div class="loan-amount">${fmt(l.amount)}</div><small class="muted">${l.term}-month request</small><hr><div class="detail-row"><span>Principal outstanding</span><b>${fmt(l.remaining)}</b></div><div class="detail-row"><span>Guarantor</span><b>${E(l.guarantor)}</b></div><div class="detail-row"><span>Purpose</span><b>${E(l.purpose)}</b></div>${l.status==='Disbursed'?btn('Repay from wallet',`openRepay('${l.id}')`,'btn btn-primary btn-xs'):btn('View application',`loanDetail('${l.id}')`,'btn btn-xs')}</div>`).join('')||`<div class="panel"><h3>No loan applications</h3><p class="note">Use “Apply for loan” to create your first simulated request.</p></div>`}</div>`}
function memberActivity(){let m=member();return `${header('My account statement','Browse your own transaction entries and download a demonstration statement.',btn('Download my statement',"exportCSV('statement')",'btn btn-primary','download'),'MEMBER STATEMENTS')}${notice}${panel('My transactions','This statement contains only fictional entries for your selected member',table(['Date','Reference','Type','Amount','Status'],d().transactions.filter(x=>x.memberId===m.id).map(t=>`<tr><td>${E(t.date)}</td><td>${E(t.id)}</td><td>${E(t.type)}</td><td class="${t.kind==='in'?'amount-pos':'amount-neg'}">${t.kind==='in'?'+':'−'}${fmt(t.amount)}</td><td>${badge(t.status)}</td></tr>`).join('')))}`}
function memberProfile(){let m=member();return `${header('My membership','A secure, member-specific profile is part of the proposed production experience.','','MY PROFILE')}${notice}<div class="two-col">${panel('Member profile','Switch the sample member to walk through the experience',`<div class="person" style="margin:0 0 20px">${avatar(m.name)}<div><b>${E(m.name)}</b><span>${E(m.id)}</span></div></div>${[['Cooperative',configs[org].name],['Member number',m.id],['Savings plan',m.plan],['Registration status',m.status],['Sample phone',m.phone]].map(([a,b])=>`<div class="task"><div class="title muted">${E(a)}</div><div class="trailing">${E(b)}</div></div>`).join('')}<div class="form-group" style="margin-top:16px"><label>Preview as another sample member</label><select onchange="d().memberIndex=+this.value;save();render()">${d().members.map((x,i)=>`<option value="${i}" ${member()===x?'selected':''}>${E(x.name)}</option>`).join('')}</select></div>`)}${panel('Member data & privacy','What changes before real rollout',`<div class="settings-grid"><div class="settings-item"><b>Identity</b><p>Member registration verified under approved cooperative policy and applicable law.</p></div><div class="settings-item"><b>Access</b><p>One member can access only their own records with authenticated sessions.</p></div><div class="settings-item"><b>Notification</b><p>Opt-in email, SMS or WhatsApp notifications, subject to provider availability.</p></div><div class="settings-item"><b>Audit</b><p>Financial actions tied to real user IDs in a secure backend.</p></div></div>`)} </div>`}
// Reusable modal helpers
function modal(title,desc,body){let old=$('#modal-root');if(old)old.remove();let div=document.createElement('div');div.id='modal-root';div.className='modal-layer';div.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-label="${E(title)}"><button class="modal-close" onclick="closeModal()" aria-label="Close dialog">×</button><h3>${title}</h3><p class="modal-desc">${desc}</p>${body}</div>`;document.body.append(div)}
function closeModal(){let e=$('#modal-root');if(e)e.remove()}
function memberOpts(selected=''){return (role==='member'?[member()]:d().members).map(m=>`<option value="${E(m.id)}" ${selected===m.id?'selected':''}>${E(m.name)} (${E(m.id)})</option>`).join('')}
function addMember(){modal('Register new member','Create a fictional member profile and approve the example membership.',`<form onsubmit="submitMember(event)"><div class="form-group"><label>Full name</label><input required name="name" maxlength="80" minlength="3" placeholder="e.g. Anita Egede"></div><div class="form-group"><label>Sample contact number</label><input required name="phone" minlength="8" maxlength="25" placeholder="0800 000 0000"></div><div class="form-group"><label>Contribution plan</label><select name="plan"><option>Weekly Savings</option><option>Monthly Savings</option><option>Daily Thrift</option></select></div><p class="note">Do not enter a real member’s private data; this is a demo stored in your browser.</p><div class="modal-actions">${btn('Cancel','closeModal()') }<button class="btn btn-primary">Create member</button></div></form>`)}
function submitMember(e){e.preventDefault();const f=new FormData(e.target),name=String(f.get('name')||'').trim();if(name.length<3)return toast('Please enter a longer name.',true);let m={id:`${configs[org].prefix}-${String(d().members.length+1).padStart(3,'0')}`,name,phone:String(f.get('phone')),plan:String(f.get('plan')),wallet:0,savings:0,shares:0,status:'Pending',joined:today()};d().members.unshift(m);d().memberIndex=0;log('Registered sample member '+name);save();closeModal();navigate('members');toast('Member created. Open the profile to approve.')}
function showMember(id){let m=mById(id);if(!m)return;modal(E(m.name),'Member record · '+E(m.id),`<div class="data-pairs">${[['Wallet',fmt(m.wallet)],['Savings',fmt(m.savings)],['Shares',fmt(m.shares)],['Plan',m.plan],['Joined',m.joined],['Status',m.status]].map(([a,b])=>`<div class="data-pair"><span>${a}</span><b>${E(b)}</b></div>`).join('')}</div><div class="modal-actions">${m.status==='Pending'?btn('Approve membership',`approveMember('${m.id}')`,'btn btn-primary','check'):btn('Open wallet',`closeModal();walletDetail('${m.id}')`,'btn btn-primary','wallet')}${btn('Allocate savings',`closeModal();openAllocate('${m.id}')`,'btn')}</div>`)}
function approveMember(id){if(!requireOfficer('Operations'))return;let m=mById(id);if(!m||m.status!=='Pending')return toast('Membership already approved',true);m.status='Active';log(`Approved membership for ${m.name}`);save();closeModal();render();toast('Sample member approved')}
function walletDetail(id){let m=mById(id);if(!m)return;modal('Member wallet: '+E(m.name),'Wallet stage · no genuine Paystack account assigned',`<div class="wallet-card" style="min-height:auto"><small>Available demo balance</small><div class="huge">${fmt(m.wallet)}</div><small>Member ID · ${E(m.id)}</small></div><div class="faux-acct"><small>Illustrative collection reference</small><strong>DEMO-${E(m.id)}</strong><em>NOT A BANK ACCOUNT NUMBER — DO NOT SEND MONEY</em></div><div class="data-pairs"><div class="data-pair"><span>Savings</span><b>${fmt(m.savings)}</b></div><div class="data-pair"><span>Shares</span><b>${fmt(m.shares)}</b></div></div><div class="modal-actions" style="flex-wrap:wrap">${btn('Paystack test payment',`closeModal();openDeposit('${m.id}')`,'btn btn-primary')}${btn('Save to thrift',`closeModal();openAllocate('${m.id}')`,'btn')}${btn('Request withdrawal',`closeModal();openWithdrawal('${m.id}')`,'btn')}</div>`)}
function paymentAmount(memberId,purpose,amount){return purpose==='membership'?500:(Number(amount)||20000)}
function psPayments(){return d().deposits.filter(x=>x.provider==='Paystack (simulation)')}
function startPaystack(id='',purpose='wallet',amount=20000){let m=mById(id||((role==='member')?member().id:d().members[0].id));if(!m)return toast('Choose a member',true);if(!ownMember(m.id))return;const fixed=purpose==='membership';modal('Paystack · Test Checkout','Demo checkout only. Never enter a real card number or transfer money.',`<div class="ps-top"><span class="ps-logo">paystack</span><span class="ps-test">SANDBOX SIMULATION</span></div><form onsubmit="submitPaystackForm(event)"><div class="form-group"><label>Paying member</label><select name="memberId">${memberOpts(m.id)}</select></div><div class="form-group"><label>What are you paying for?</label><select name="purpose" onchange="document.getElementById('ps-amount').value=this.value==='membership'?'500':'20000';document.getElementById('ps-amount').readOnly=this.value==='membership'"><option value="wallet" ${!fixed?'selected':''}>Fund cooperative wallet</option><option value="membership" ${fixed?'selected':''}>Monthly platform subscription · ₦500</option></select></div><div class="form-group"><label>Amount in naira</label><input id="ps-amount" name="amount" type="number" min="100" max="1000000" value="${fixed?500:amount}" ${fixed?'readonly':''} required></div><div class="form-group"><label>Payment method</label><select name="channel"><option value="card">Card</option><option value="bank_transfer">Bank transfer</option><option value="ussd">USSD</option></select></div><div class="ps-info">🔒 Your payment will be handled by Paystack in production. This prototype is a local simulation without payment credentials.</div><div class="modal-actions">${btn('Cancel','closeModal()')}<button class="btn btn-primary">Continue to checkout →</button></div></form>`)}
function openDeposit(id=''){return startPaystack(id,'wallet')}
function submitPaystackForm(e){e.preventDefault();const f=new FormData(e.target),id=String(f.get('memberId')),purpose=String(f.get('purpose')),amount=paymentAmount(id,purpose,f.get('amount')),channel=String(f.get('channel'));if(!mById(id)||!ownMember(id)||!Number.isFinite(amount)||amount<100||amount>1000000){toast('Invalid member or amount',true);return}const ref=ident('PSK-DEMO');const pay={id:ref,memberId:id,amount,purpose,channel,provider:'Paystack (simulation)',status:'Checkout opened',date:today(),reference:ref};d().deposits.unshift(pay);log('Initiated Paystack-style test payment '+ref,role==='member'?member().name:actorRole);save();closeModal();showPaystackCheckout(ref)}
function showPaystackCheckout(id){const r=d().deposits.find(x=>x.id===id);if(!r)return toast('Payment missing',true);if(['Completed','Failed','Cancelled'].includes(r.status))return showPaystackReceipt(id);const ch={card:'Debit card',bank_transfer:'Bank transfer',ussd:'USSD'}[r.channel]||'Card';modal('Paystack · Secure Checkout (Demo)','Simulated payment interface — no Paystack request or funds transfer occurs.',`<div class="ps-top"><span class="ps-logo">paystack</span><span class="ps-test">DEMO · NOT A LIVE CHECKOUT</span></div><div class="ps-checkout"><span class="ps-mini">AMOUNT TO PAY</span><div class="ps-price">${fmt(r.amount)}</div><p>${r.purpose==='membership'?'Monthly CoopBridge service fee':'Cooperative wallet top-up'}</p><div class="ps-line"><span>Member</span><b>${E(mById(r.memberId)?.name)}</b></div><div class="ps-line"><span>Method</span><b>${E(ch)}</b></div><div class="ps-line"><span>Reference</span><b style="font-size:10px">${E(r.id)}</b></div></div><div class="ps-info">${r.channel==='card'?'Card: the real Paystack checkout would securely collect card details. No card numbers are entered in this demo.':r.channel==='bank_transfer'?'Transfer: Paystack would display eligible payment instructions in its actual checkout. No bank account is generated here.':'USSD: eligible bank options would be offered by Paystack. No live code is provided here.'}</div><div class="ps-buttons">${btn('Simulate successful payment',`paystackOutcome('${id}','paid')`,'btn btn-primary','check')}${btn('Simulate failed payment',`paystackOutcome('${id}','Failed')`,'btn btn-red')}${btn('Simulate pending / close',`paystackOutcome('${id}','Pending')`,'btn')}</div>`)}
function paystackOutcome(id,result){let r=d().deposits.find(x=>x.id===id);if(!r||r.status!=='Checkout opened'&&r.status!=='Pending')return toast('Already processed or unavailable',true);r.status=result==='paid'?'Paid · awaiting verification':result;log(`Paystack-style test ${result} · ${r.id}`,'Sandbox simulator');save();closeModal();render();if(result==='paid'){modal('Payment received · verification pending','A checkout success screen does NOT credit a member automatically. A verified backend event is required.',`<div class="ps-top"><b class="ps-logo">paystack</b><span class="ps-test">VERIFICATION STEP</span></div><div class="ps-checkout"><div class="ps-price">${fmt(r.amount)}</div><p>Reference: ${E(r.id)}</p><p>${badge(r.status)}</p></div><div class="ps-info">Production: server validates Paystack signature/reference, amount in kobo, success status and idempotency. For this demo, use the next button to simulate that approved verification.</div><div class="modal-actions">${btn('Close · still pending','closeModal()')}${btn('Simulate verified webhook',`verifyPaystackDemo('${id}')`,'btn btn-primary','check')}</div>`)}else toast(result==='Pending'?'Payment still pending; no credit posted':'Payment failed; no balance credited',result!=='Pending')}
function verifyPaystackDemo(id){const r=d().deposits.find(x=>x.id===id);if(!r||r.provider!=='Paystack (simulation)'||r.status!=='Paid · awaiting verification')return toast('Reference is not eligible or was already credited',true);if(d().transactions.some(x=>x.memo===id))return toast('Duplicate webhook blocked, no double credit',true);const m=mById(r.memberId);if(!m||r.amount<100||r.amount>1000000||r.purpose==='membership'&&r.amount!==500)return toast('Amount or member verification failed',true);r.status='Completed';r.verifiedBy='Server verification (simulated)';r.verifiedAt=new Date().toISOString();if(r.purpose==='wallet'){m.wallet+=r.amount}else{d().paidSubscriptions=d().paidSubscriptions||[];d().paidSubscriptions.unshift({memberId:m.id,amount:500,reference:r.id,date:today(),partnerShare:d().partnerShare});}d().transactions.unshift({id:ident('TX'),memberId:m.id,type:r.purpose==='wallet'?'Paystack wallet funding (demo)':'Monthly platform fee (demo)',amount:r.amount,kind:r.purpose==='wallet'?'in':'fee',status:'Completed',date:today(),memo:r.id});log(`Verified mock Paystack payment ${r.id}; ${r.purpose==='wallet'?'wallet credited':'platform fee recorded'}`,'Simulated server webhook');save();closeModal();render();showPaystackReceipt(id)}
function showPaystackReceipt(id){const r=d().deposits.find(x=>x.id===id);if(!r)return;modal('Payment status · '+E(r.id),'Paystack-style transaction record (demonstration)',`<div class="ps-top"><b class="ps-logo">paystack</b><span class="ps-test">SIMULATED</span></div><div class="ps-checkout"><div class="ps-price">${fmt(r.amount)}</div><div style="margin:10px">${badge(r.status)}</div><div class="ps-line"><span>Member</span><b>${E(mById(r.memberId)?.name)}</b></div><div class="ps-line"><span>Purpose</span><b>${r.purpose==='membership'?'Monthly platform fee':'Wallet top-up'}</b></div><div class="ps-line"><span>Reference</span><b style="font-size:10px">${E(r.id)}</b></div></div><div class="ps-info">Fictional payment receipt. It is not evidence of a real Paystack transaction.</div><div class="modal-actions">${btn('Close','closeModal()')}${r.status==='Paid · awaiting verification'?btn('Simulate webhook',`verifyPaystackDemo('${id}')`,'btn btn-primary'):''}${['Checkout opened','Pending'].includes(r.status)?btn('Resume demo checkout',`closeModal();showPaystackCheckout('${id}')`,'btn btn-primary'):''}</div>`)}
function submitDeposit(e){return submitPaystackForm(e)}
function confirmDeposit(id){return verifyPaystackDemo(id)}
function openAllocate(id=''){let selected=id||(role==='member'?member().id:d().members[0].id);modal('Allocate wallet funds to savings','Move existing demo wallet value into a contribution plan. This action does not create new money.',`<form onsubmit="submitAllocate(event)"><div class="form-group"><label>Member</label><select name="memberId" onchange="document.getElementById('allocation-balance').textContent='Available wallet: '+window.demoBalance(this.value)">${memberOpts(selected)}</select></div><div class="amount-preview" id="allocation-balance">Available wallet: ${fmt(mById(selected)?.wallet||0)}</div><div class="form-group"><label>Contribution type</label><select name="type"><option>Weekly thrift contribution</option><option>Monthly savings contribution</option><option>Share capital contribution</option></select></div><div class="form-group"><label>Amount (₦)</label><input name="amount" required type="number" min="1" value="${Math.min(d().settings.weekly,mById(selected)?.wallet||0)||1000}"></div><div class="modal-actions">${btn('Cancel','closeModal()')}<button class="btn btn-primary">Simulate allocation</button></div></form>`)}
window.demoBalance=id=>fmt(mById(id)?.wallet||0);
function submitAllocate(e){e.preventDefault();let f=new FormData(e.target),m=mById(String(f.get('memberId'))),amount=Number(f.get('amount')),type=String(f.get('type'));if(!m||!ownMember(m.id)||!(amount>0&&Number.isFinite(amount)))return toast('Enter a valid amount',true);if(amount>m.wallet)return toast('Insufficient demo wallet funds. Simulate a top-up first.',true);m.wallet-=amount;if(type.startsWith('Share'))m.shares+=amount;else m.savings+=amount;d().transactions.unshift({id:ident('TX'),memberId:m.id,type,amount,kind:'out',status:'Completed',date:today(),memo:'Wallet to contribution allocation'});log(`Allocated ${fmt(amount)} from ${m.id} wallet to ${type}`,role==='member'?'Demo member':'Demo administrator');save();closeModal();render();toast(`${fmt(amount)} allocated. Wallet reduced; contribution ledger increased.`)}
function openWithdrawal(id=''){let selected=id||(role==='member'?member().id:d().members[0].id);modal('Request wallet withdrawal','Withdrawal will enter a two-stage approval queue. No actual bank transfer will occur.',`<form onsubmit="submitWithdrawal(event)"><div class="form-group"><label>Member</label><select name="memberId" onchange="document.getElementById('withdraw-balance').textContent='Available wallet: '+window.demoBalance(this.value)">${memberOpts(selected)}</select></div><div class="amount-preview" id="withdraw-balance">Available wallet: ${fmt(mById(selected)?.wallet||0)}</div><div class="form-group"><label>Withdrawal amount (₦)</label><input type="number" min="1" name="amount" value="3000" required></div><div class="form-group"><label>Destination information</label><select name="bank"><option>Saved member bank account (sample)</option><option>Authorised bank account (sample)</option></select></div><p class="note">In production, destination accounts must be validated. All withdrawal holds and authorisations must be server-enforced.</p><div class="modal-actions">${btn('Cancel','closeModal()')}<button class="btn btn-primary">Submit request</button></div></form>`)}
function submitWithdrawal(e){e.preventDefault();let f=new FormData(e.target),m=mById(String(f.get('memberId'))),amount=Number(f.get('amount'));if(!m||!ownMember(m.id)||!(amount>0&&amount<=m.wallet))return toast('Insufficient demo wallet or invalid amount',true);m.wallet-=amount;let w={id:ident('WD'),memberId:m.id,amount,bank:String(f.get('bank')),status:'Pending',date:today()};d().withdrawals.unshift(w);log(`${m.name} requested withdrawal ${fmt(amount)}; funds placed on hold`,'Demo member');save();closeModal();render();toast('Withdrawal requested. Amount held pending approvals.')}
function withdrawAdvance(id){let w=d().withdrawals.find(x=>x.id===id);if(!w)return;let before=w.status,required=before==='Pending'?'Treasurer':before==='Treasurer approved'?'Chairman':before==='Approved'?'Treasurer':null;if(!required)return toast('Withdrawal already resolved',true);if(!requireOfficer(required))return;if(before==='Pending')w.status='Treasurer approved';else if(before==='Treasurer approved')w.status='Approved';else{w.status='Completed';d().transactions.unshift({id:ident('TX'),memberId:w.memberId,type:'Wallet withdrawal · mock bank payout',amount:w.amount,kind:'out',status:'Completed',date:today(),memo:w.id})}log(`Withdrawal ${id}: ${before} → ${w.status}`,actorRole);save();render();toast('Withdrawal updated: '+w.status)}
function rejectWithdrawal(id){if(!requireOfficer('Treasurer'))return;let w=d().withdrawals.find(x=>x.id===id);if(!w||['Completed','Rejected'].includes(w.status))return toast('Already resolved',true);w.status='Rejected';let m=mById(w.memberId);if(m)m.wallet+=w.amount;log(`Withdrawal ${id} declined and hold released`);save();render();toast('Withdrawal rejected. Held demo funds returned to wallet.')}
function applyLoan(id=''){let who=id||(role==='member'?member().id:d().members.find(x=>x.status==='Active')?.id);if(!who)return toast('No active member found',true);let selected=mById(who);if(!selected||selected.status!=='Active')return toast('Activate member before lending',true);let eligible=d().members.filter(m=>m.id!==who&&m.status==='Active');modal('Request a cooperative loan','Member application → separate guarantor consent → treasurer recommendation → chairman authorisation → simulated disbursement.',`<form onsubmit="submitLoan(event)"><div class="form-group"><label>Borrowing member</label><select name="memberId">${memberOpts(who)}</select></div><div class="form-row"><div class="form-group"><label>Principal requested (₦)</label><input name="amount" type="number" min="1000" max="100000000" value="50000" required></div><div class="form-group"><label>Requested tenor</label><select name="term"><option value="3">3 months</option><option value="6" selected>6 months</option><option value="9">9 months</option><option value="12">12 months</option></select></div></div><div class="form-group"><label>Loan purpose</label><input name="purpose" required maxlength="100" value="Business working capital"></div><div class="form-group"><label>Registered guarantor (must consent)</label><select name="guarantorId" required>${eligible.map(m=>`<option value="${E(m.id)}">${E(m.name)} (${E(m.id)})</option>`).join('')}</select></div><p class="note">Member savings, eligibility limits, interest, guarantor liability and repayment schedule must be agreed under the cooperative's actual policy. This demo tracks principal only.</p><div class="modal-actions">${btn('Cancel','closeModal()')}<button class="btn btn-primary">Submit for guarantor consent</button></div></form>`)}
function submitLoan(e){e.preventDefault();let f=new FormData(e.target),amount=Number(f.get('amount')),id=String(f.get('memberId')),gId=String(f.get('guarantorId')),borrower=mById(id),g=mById(gId);if(!ownMember(id))return;if(!borrower||borrower.status!=='Active'||!g||g.status!=='Active'||gId===id||!(amount>=1000&&amount<=100000000))return toast('Select two different active members and a valid amount',true);let l={id:ident('LN'),memberId:id,guarantorId:gId,amount,remaining:amount,term:Number(f.get('term')),guarantor:g.name,purpose:String(f.get('purpose')),status:'Guarantor pending',date:today(),consent:false};d().loans.unshift(l);log(`Loan ${l.id} requested by ${borrower.name}; guarantor consent requested from ${g.name}`,role==='member'?'Demo member':'Operations');save();closeModal();render();toast('Loan created. Ask the guarantor to accept in their member view.')}
function loanDetail(id){let l=d().loans.find(x=>x.id===id);if(!l)return;modal('Loan application '+E(l.id),'Recorded stages: guarantor consent → treasurer → chairman → simulated disbursement.',`<div class="data-pairs">${[['Member',mById(l.memberId)?.name],['Principal',fmt(l.amount)],['Outstanding',fmt(l.remaining)],['Illustrative principal per month',fmt(l.amount/l.term)+' · interest excluded'],['Term',l.term+' months'],['Purpose',l.purpose],['Guarantor',l.guarantor],['Status',l.status],['Requested',l.date]].map(([a,b])=>`<div class="data-pair"><span>${E(a)}</span><b>${E(b)}</b></div>`).join('')}</div><p class="note">Interest rate, affordability checks, schedule, guarantor limits and payout destination must follow the cooperative's approved lending policy.</p><div class="modal-actions" style="flex-wrap:wrap">${btn('Close','closeModal()')}${l.status==='Disbursed'?btn('Repay principal',`closeModal();openRepay('${l.id}')`,'btn btn-primary'):role==='member'&&member().id===l.guarantorId&&l.status==='Guarantor pending'?btn('Accept guarantee',`acceptGuarantor('${l.id}')`,'btn btn-primary'):['Pending','Treasurer approved','Approved'].includes(l.status)?btn('Next authorised stage',`loanAdvance('${l.id}')`,'btn btn-primary'):''}</div>`)}
function loanAdvance(id){let l=d().loans.find(x=>x.id===id);if(!l)return;const from=l.status;if(from==='Guarantor pending')return toast('A registered guarantor must consent first',true);let required=from==='Pending'?'Treasurer':from==='Treasurer approved'?'Chairman':from==='Approved'?'Treasurer':null;if(!required)return toast('Loan is not in an approvable state',true);if(!requireOfficer(required))return;let memberRecord=mById(l.memberId);if(!memberRecord||memberRecord.status!=='Active')return toast('Borrower must be an active member',true);if(from==='Pending')l.status='Treasurer approved';else if(from==='Treasurer approved')l.status='Approved';else{l.status='Disbursed';memberRecord.wallet+=l.amount;d().transactions.unshift({id:ident('TX'),memberId:l.memberId,type:'Loan disbursement · mock settlement',amount:l.amount,kind:'in',status:'Completed',date:today(),memo:l.id})}log(`Loan ${id}: ${from} → ${l.status}`,actorRole);save();closeModal();render();toast(l.status==='Disbursed'?'Mock disbursement posted to member wallet':'Approved stage: '+l.status)}
function acceptGuarantor(id){let l=d().loans.find(x=>x.id===id);if(!l||l.status!=='Guarantor pending'||!l.guarantorId)return toast('No outstanding guarantor request',true);if(role!=='member'||member().id!==l.guarantorId)return toast('Switch to the named guarantor member profile to consent',true);l.status='Pending';l.consent=true;l.guaranteedAt=new Date().toLocaleString('en-GB');log(`Guarantor ${member().name} accepted sample guarantee on loan ${l.id}`,'Member guarantor');save();closeModal();navigate('myloans');toast('Guarantee accepted. Loan sent to treasurer.')}
function declineGuarantor(id){let l=d().loans.find(x=>x.id===id);if(!l||l.status!=='Guarantor pending'||role!=='member'||member().id!==l.guarantorId)return toast('Not an outstanding guarantor request',true);l.status='Guarantor declined';log(`Guarantor declined loan ${id}`,'Member guarantor');save();render();toast('Guarantee declined; borrower must resubmit.')}
function guarantorInbox(){const inbox=d().loans.filter(l=>l.guarantorId===member().id&&l.status==='Guarantor pending');return panel('Guarantee requests requiring my consent','The borrower cannot proceed to officer approval until you accept.',inbox.length?inbox.map(l=>`<div class="task"><span class="glyph amber">${ico('shield')}</span><div><div class="title">${E(mById(l.memberId)?.name)} · ${fmt(l.amount)}</div><div class="info">${E(l.id)} · ${E(l.purpose)} · ${l.term} months</div></div><div class="row-actions">${btn('Accept',`acceptGuarantor('${l.id}')`,'btn btn-xs btn-primary')}${btn('Decline',`declineGuarantor('${l.id}')`,'btn btn-xs btn-red')}</div></div>`).join(''):'<p class="note">No outstanding guarantee requests for this sample member.</p>')}
function rejectLoan(id){if(role!=='admin'||!['Treasurer','Chairman'].includes(actorRole))return toast('Treasurer or chairman required',true);let l=d().loans.find(x=>x.id===id);if(!l||!['Pending','Treasurer approved'].includes(l.status))return toast('Unable to reject',true);l.status='Rejected';log(`Loan ${id} rejected`);save();render();toast('Loan request rejected')}
function openRepay(id){let l=d().loans.find(x=>x.id===id);if(!l||l.status!=='Disbursed')return toast('No disbursed loan selected',true);let m=mById(l.memberId);modal('Repay loan '+E(l.id),'Simulate paying loan principal from the member wallet. No real debit or interest calculation.',`<form onsubmit="submitRepay(event,'${l.id}')"><div class="data-pairs" style="margin-bottom:16px"><div class="data-pair"><span>Available member wallet</span><b>${fmt(m.wallet)}</b></div><div class="data-pair"><span>Principal remaining</span><b>${fmt(l.remaining)}</b></div></div><div class="form-group"><label>Repayment amount (₦)</label><input type="number" name="amount" min="1" max="${Math.min(m.wallet,l.remaining)}" value="${Math.min(m.wallet,l.remaining,10000)}" required></div><div class="modal-actions">${btn('Cancel','closeModal()')}<button class="btn btn-primary">Simulate repayment</button></div></form>`)}
function submitRepay(e,id){e.preventDefault();let l=d().loans.find(x=>x.id===id),m=mById(l?.memberId),amount=Number(new FormData(e.target).get('amount'));if(!m||!l||!(amount>0&&amount<=l.remaining&&amount<=m.wallet))return toast('Repayment exceeds wallet or outstanding principal',true);m.wallet-=amount;l.remaining-=amount;if(!l.remaining)l.status='Completed';d().transactions.unshift({id:ident('TX'),memberId:m.id,type:'Loan principal repayment',amount,kind:'out',status:'Completed',date:today(),memo:l.id});log(`Loan ${l.id} principal repayment ${fmt(amount)} from ${m.id} wallet`);save();closeModal();render();toast(`${fmt(amount)} principal repaid in demo`)}
function saveSettings(){let el=$('#weekly'),mo=$('#monthly'),sh=$('#shares'),vals=[el,mo,sh].map(x=>Number(x?.value));if(vals.some(x=>!Number.isFinite(x)||x<100||x>10000000))return toast('Enter valid plan amounts between ₦100 and ₦10m',true);d().settings={weekly:vals[0],monthly:vals[1],share:vals[2]};log('Updated sample contribution settings');save();render();toast('Demonstration settings saved')}
function resetDemo(){modal('Reset demo data?','Only the selected cooperative\'s fictional records will be reset to initial example values.',`<p class="note">This will clear all local demo transactions and new members for ${E(configs[org].short)}, but will not affect the other cooperative workspace.</p><div class="modal-actions">${btn('Cancel','closeModal()')}${btn('Reset selected demo',`db[org]=seed(org);save();closeModal();render();toast('Demo restored')`,'btn btn-red','refresh')}</div>`)}
function receipt(id){const tx=d().transactions.find(x=>x.id===id);if(!tx)return toast('Transaction not found',true);const m=mById(tx.memberId);modal('Transaction receipt · DEMO','This is a simulated ledger record, not proof of payment to a bank.',`<div class="faux-acct"><small>${E(configs[org].name)}</small><strong style="font-size:17px">${E(tx.id)}</strong><em>FICTIONAL TRANSACTION · NOT VALID FOR PAYMENT</em></div><div class="data-pairs">${[['Date',tx.date],['Member',m?.name],['Narration',tx.type],['Reference',tx.memo||tx.id],['Amount',fmt(tx.amount)],['Status',tx.status]].map(([a,b])=>`<div class="data-pair"><span>${E(a)}</span><b>${E(b)}</b></div>`).join('')}</div><div class="modal-actions">${btn('Close','closeModal()')}${btn('Print receipt','window.print()','btn btn-primary','receipt')}</div>`)}
function exportCSV(type){let data=[],name='';const ds=d();if(type==='members'){name='members';data=[['ID','Name','Demo phone','Plan','Wallet','Savings','Shares','Status'],...ds.members.map(m=>[m.id,m.name,m.phone,m.plan,m.wallet,m.savings,m.shares,m.status])]}else if(type==='loans'){name='loans';data=[['Reference','Member ID','Amount','Principal due','Months','Guarantor','Purpose','Status'],...ds.loans.map(l=>[l.id,l.memberId,l.amount,l.remaining,l.term,l.guarantor,l.purpose,l.status])]}else if(type==='transactions'||type==='statement'){name=type;let tx=type==='statement'?ds.transactions.filter(t=>t.memberId===member().id):ds.transactions;data=[['Reference','Date','Member','Type','Amount NGN','Direction','Status','Note'],...tx.map(t=>[t.id,t.date,mById(t.memberId)?.name||'',t.type,t.amount,t.kind,t.status,t.memo||''])]}else if(type==='report'){name='financial-summary';data=[['Report for',configs[org].name],['Report','Demonstration only'],['Members',ds.members.length],['Wallet total NGN',ds.members.reduce((a,m)=>a+m.wallet,0)],['Savings total NGN',ds.members.reduce((a,m)=>a+m.savings,0)],['Share capital NGN',ds.members.reduce((a,m)=>a+m.shares,0)],['Principal receivable NGN',ds.loans.filter(l=>l.status==='Disbursed').reduce((a,l)=>a+l.remaining,0)],[],['Audit entry','Actor','Time'],...ds.audit.map(a=>[a.event,a.actor,a.at])]}else if(type==='economics'){name='commercial-scenario';data=[['Cooperative',configs[org].name],['Pricing','Indicative subject to agreement'],['Fee per paying member monthly NGN',500],['Cooperative proposed share per member NGN',ds.partnerShare],['Hypothetical paying members',ds.pilotMembers],['Hypothetical gross receipts NGN',ds.pilotMembers*500],['Hypothetical cooperative share NGN',ds.pilotMembers*ds.partnerShare],['Hypothetical platform before costs NGN',ds.pilotMembers*(500-ds.partnerShare)]]}else return;let csv=data.map(row=>row.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');let blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});let url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=`CoopBridge_${org}_${name}_DEMO.csv`;document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);toast('Sample '+name+' CSV downloaded')}

// Nigerian cooperative workflow lab. All state remains in browser-local fictional records.
