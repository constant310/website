function ensureNigeria(){const ds=d();if(!ds.ng){ds.ng={cases:[{id:'EX-TRF-019',kind:'Unmatched bank transfer',memberId:ds.members[0].id,amount:18000,reference:'NIP-SAMPLE-8372',status:'Needs verification',note:'Payer name differs from registered member. Do not credit automatically.',date:'2026-10-20'},{id:'EX-POS-014',kind:'POS failed / debit alert',memberId:ds.members[2].id,amount:10000,reference:'POS-SAMPLE-1610',status:'Awaiting provider status',note:'Customer has debit alert, but settlement not confirmed.',date:'2026-10-20'},{id:'EX-CASH-011',kind:'Cash collector return',memberId:ds.members[3].id,amount:5000,reference:'COL-SAMPLE-112',status:'Needs verification',note:'Agent collected cash; treasurer must verify lodgement.',date:'2026-10-19'}],tickets:[{id:'CASE-TT-031',memberId:ds.members[0].id,type:'Savings balance dispute',detail:'My paper receipt shows ₦10,000 paid last week but I cannot see it in the records.',status:'Open',reply:'',created:'2026-10-20'},{id:'CASE-TT-032',memberId:ds.members[1].id,type:'Withdrawal delay',detail:'Please confirm the expected approval timeline.',status:'In review',reply:'We are reviewing the request with the treasurer.',created:'2026-10-19'}],nudges:[],caseHistory:[]};save()}return ds.ng}
const ngCases=[['bank','Bank transfer arrives late','Do not credit from SMS or screenshot. Keep a pending reference and confirm provider status before posting.','bank'],['pos','POS debit but no settlement','Keep debit alert as evidence, escalate to settlement investigation and avoid false wallet credits.','bank'],['cash','Member pays cash to collector','Record provisional collection and collector ID; bank lodge and treasurer review must agree before credit.','users'],['unmatched','Wrong narration or unknown sender','Put incoming funds in suspense for matching, never assign money by guesswork.','search'],['dupe','Same payment reference submitted twice','Reject a repeated provider payment event or cash receipt reference; keep audit trail.','shield'],['loan','Member requests emergency loan','Check guarantee consent, policy eligibility, treasurer, chairman and payout verification.','loans'],['arrears','Member misses scheduled contributions','Show arrears without pretending money moved; allow grace periods and policy-based reminders.','clock'],['guarantor','Guarantor refuses responsibility','Stop loan progression and show the refusal to the borrower.','shield'],['withdraw','Withdrawal during savings lock','Allow withdrawal only from unrestricted balances; other requests go through bylaw review.','wallet'],['dispute','Member disputes balance or fee','Give a case reference, evidence requests, response tracking and an audit trail.','info'],['exit','Member resigns from cooperative','Create an exit request; assess share refund, outstanding loan and notice periods under bylaws.','users'],['offline','Member without smartphone or data','Offer office-assisted service and paper/CSV receipt; no fake USSD or SMS claims.','report']];
function nigeriaPage(){let n=ensureNigeria(),ds=d(),pending=n.cases.filter(x=>!['Resolved','Rejected'].includes(x.status)).length,open=n.tickets.filter(x=>x.status!=='Resolved').length;return `${header('Built around Nigerian cooperative life','What your chairman, treasurer, field collector and everyday member actually need to see.','','NIGERIA OPERATIONS LAB')}${notice}<div class="ng-hero"><div><span class="ng-badge">DEMO • Effurun / Warri</span><h3>Trust before technology.<br>Records before automation.</h3><p>Cash and POS, bank-transfer delays, guarantors, weekly thrift, office-assisted members, disputes and monthly dues — shown as realistic decision points using fictional data.</p><div class="ng-switch-tips">${btn('Show member experience',"switchRole('member');navigate('mydues')",'btn btn-soft','users')}${btn('Review collection issues',"navigate('collections')",'btn','bank')}</div></div><div class="ng-metrics"><div class="ng-metric"><small>Cases needing attention</small><b>${pending}</b></div><div class="ng-metric"><small>Unresolved requests</small><b>${open}</b></div><div class="ng-metric"><small>Payment rails</small><b>Mock</b></div></div></div><div class="ng-cards">${ngCases.map(([id,title,desc,icon],i)=>`<article class="ng-card"><span class="glyph">${ico(icon)}</span><h4>${String(i+1).padStart(2,'0')} · ${title}</h4><p>${desc}</p>${btn('Demonstrate case',`showScenario('${id}')`,'btn btn-xs btn-primary','arrow')}</article>`).join('')}</div>${panel('Product approach for Warri cooperatives','Controls to agree with the cooperative before a real pilot',`<div class="ng-steps"><span class="ng-step">Staff-assisted onboarding</span><span class="ng-step">Daily / weekly / monthly thrift</span><span class="ng-step">Cash/POS exception queue</span><span class="ng-step">Name / reference matching</span><span class="ng-step">Two-person maker/checker</span><span class="ng-step">Member dispute resolution</span><span class="ng-step">Guarantor consent</span><span class="ng-step">CSV migration & export</span><span class="ng-step">Data privacy and consent</span><span class="ng-step">No real funds in demo</span></div><div class="ng-screen-notice">Paystack API access and allowed payment activities depend on its onboarding and applicable licences. CoopBridge does not issue real bank accounts or hold deposits in this demo. Any cooperative revenue share is a commercial proposal, not an automatic financial return.</div>`)}`}
function showScenario(id){ensureNigeria();if(['bank','pos','cash','unmatched','dupe'].includes(id)){if(id==='dupe')return modal('Duplicate transfer reference blocked','Reference uniqueness and idempotency are essential in production.',`<p class="note">A reference that was already reconciled must not credit any wallet a second time. The real system checks uniqueness server-side, plus bank provider status, amount and destination account.</p><div class="modal-actions">${btn('Close','closeModal()')}${btn('Open matching desk',"closeModal();navigate('collections')",'btn btn-primary')}</div>`);if(id==='bank')return modal('A transfer is delayed','A bank debit alert is not final proof that cooperative funds were received.',`<p class="note">Open the Collections & Exceptions desk; the case remains pending until the provider/bank confirms settlement.</p><div class="modal-actions">${btn('Open bank exceptions',"closeModal();navigate('collections')",'btn btn-primary')}</div>`);if(id==='cash')return openFieldCollection();navigate('collections');return;}if(id==='loan'){switchRole('member');navigate('myloans');return}if(id==='arrears'){navigate('risk');return}if(id==='guarantor'){switchRole('member');let l=d().loans.find(x=>x.guarantorId&&x.status==='Guarantor pending');if(l){let i=d().members.findIndex(m=>m.id===l.guarantorId);if(i>=0)d().memberIndex=i;save()}navigate('myloans');return}if(id==='withdraw'){switchRole('member');navigate('mydues');return}if(id==='dispute'){switchRole('member');navigate('myhelp');return}if(id==='exit'){switchRole('member');navigate('myhelp');return}if(id==='offline'){navigate('members');modal('Office-assisted membership','The service must include members who do not own smartphones.',`<p class="note">The secretary can manage enrolment and print a receipt with a member number. Notifications and USSD would require actual provider integrations, agreement and testing, not just a button.</p><div class="modal-actions">${btn('Close','closeModal()')}</div>`);return}}
function caseBadge(c){return `<span class="ng-tag ${c.status==='Rejected'?'critical':c.status==='Resolved'?'':'warning'}">${E(c.status)}</span>`}
function collectionsPage(){let n=ensureNigeria(),ds=d();let unresolved=n.cases.filter(x=>!['Resolved','Rejected'].includes(x.status)).length;return `${header('Cash, POS & transfer matching','The reality of collections: do not credit a member simply because they show a debit alert.',btn('Record cash / POS collection',"openFieldCollection()",'btn btn-primary','plus'),'COLLECTIONS & EXCEPTIONS')}${notice}<div class="ng-metrics"><div class="ng-metric"><small>Unresolved cases</small><b>${unresolved}</b></div><div class="ng-metric"><small>Open cash / POS cases</small><b>${n.cases.filter(x=>/cash|pos/i.test(x.kind)&&!['Resolved','Rejected'].includes(x.status)).length}</b></div><div class="ng-metric"><small>Unverified value</small><b>${fmt(n.cases.filter(x=>!['Resolved','Rejected'].includes(x.status)).reduce((a,x)=>a+x.amount,0))}</b></div></div><div class="ng-narrative"><b>How a genuine payment would settle:</b> Receive payment reference → check provider/provider payment event → match amount and intended member → have an authorised officer reconcile → write an immutable ledger entry. The buttons below simulate those stages with example evidence.</div>${panel('Collection exception queue','Fictional events representing common Warri cooperative payment problems',n.cases.map(c=>`<div class="ng-case"><span class="glyph ${c.status==='Resolved'?'':'amber'}">${ico('bank')}</span><div class="ng-case-content"><strong>${E(c.kind)} · ${fmt(c.amount)}</strong> ${caseBadge(c)}<p>${E(c.reference)} · ${E(mById(c.memberId)?.name||'Unassigned')} · ${E(c.date)}</p><p>${E(c.note||'')}</p>${c.evidence?`<p><b>Evidence supplied:</b> ${E(c.evidence)}</p>`:''}<div class="ng-case-actions">${!['Resolved','Rejected'].includes(c.status)?btn('Review & match',`openCaseResolution('${c.id}')`,'btn btn-xs btn-primary','check'):''}${!['Resolved','Rejected'].includes(c.status)?btn('Reject unverified',`rejectCase('${c.id}')`,'btn btn-xs btn-red'):''}</div></div></div>`).join('')||'<p class="ng-empty">No exceptions.</p>')}${panel('Finance control: no double credits','What must be enforced in the production backend',`<div class="ng-steps"><span class="ng-step">One unique provider reference</span><span class="ng-step">Bank-side verification</span><span class="ng-step">No photo-only confirmation</span><span class="ng-step">Collector accountability</span><span class="ng-step">Escalation & adjustment authorisation</span><span class="ng-step">Matching history</span></div><div class="ng-notice">No live Paystack API calls, actual account verification, POS acquiring or provider-side settlement occurs here. The named evidence is fictional.</div>`)}`}
function openFieldCollection(){if(role==='member')return toast('Only staff can record office collections',true);modal('Record office / field collection','Operations officer records the claim. Treasurer verifies settlement before any sample balance is credited.',`<form onsubmit="submitFieldCollection(event)"><div class="form-group"><label>Member</label><select name="memberId">${memberOpts()}</select></div><div class="form-row"><div class="form-group"><label>Channel</label><select name="channel"><option>Cash collector return</option><option>POS terminal transaction</option><option>Bank transfer mismatch</option></select></div><div class="form-group"><label>Amount (₦)</label><input type="number" min="100" name="amount" value="10000" required></div></div><div class="form-group"><label>Bank / POS / collector reference</label><input name="reference" value="FIELD-SAMPLE-001" maxlength="60" required></div><div class="form-group"><label>Collection officer or terminal ID</label><input name="collector" value="Sample officer · WARRI-02" required></div><p class="note">Record the money claim as pending. Neither member savings nor wallet balance increases here.</p><div class="modal-actions">${btn('Cancel','closeModal()')}<button class="btn btn-primary">Save pending collection</button></div></form>`)}
function submitFieldCollection(e){e.preventDefault();if(!requireOfficer('Operations'))return;const f=new FormData(e.target),amount=Number(f.get('amount')),reference=String(f.get('reference')||'').trim(),memberId=String(f.get('memberId'));if(!(amount>0&&Number.isFinite(amount))||!mById(memberId)||reference.length<5)return toast('Enter a valid amount, member and reference',true);let n=ensureNigeria();if(n.cases.some(c=>c.reference.toLowerCase()===reference.toLowerCase())||d().deposits.some(x=>x.id===reference)||d().transactions.some(x=>x.memo===reference))return toast('Duplicate reference blocked in this demonstration.',true);n.cases.unshift({id:ident('CASE'),kind:String(f.get('channel')),memberId,amount,reference,collector:String(f.get('collector')),status:'Needs verification',date:today(),note:'Recorded by field officer. Treasurer must confirm settlement before credit.'});log(`Filed collection exception ${reference} - ${fmt(amount)}`,actorRole);save();closeModal();navigate('collections');toast('Pending collection recorded; no balance credited')}
function openCaseResolution(id){let n=ensureNigeria(),c=n.cases.find(x=>x.id===id);if(!c||['Resolved','Rejected'].includes(c.status))return;modal('Review collection '+E(c.id),'Treasurer must independently confirm evidence. This is a simulated provider payment event.',`<div class="data-pairs"><div class="data-pair"><span>Member</span><b>${E(mById(c.memberId)?.name)}</b></div><div class="data-pair"><span>Claimed amount</span><b>${fmt(c.amount)}</b></div><div class="data-pair"><span>Reference</span><b>${E(c.reference)}</b></div><div class="data-pair"><span>Current status</span><b>${E(c.status)}</b></div></div><form onsubmit="resolveCollection(event,'${E(id)}')"><div class="form-group"><label>Simulated reconciled evidence</label><select name="evidence" required><option value="">Choose confirmation result...</option><option value="Verified sample bank settlement & reference match">Verified sample bank settlement & reference match</option><option value="Verified cash bank lodgement & collector tally">Verified cash lodgement & collector tally</option><option value="Verified POS provider settlement reference">Verified POS provider settlement reference</option></select></div><label class="note"><input type="checkbox" name="check" required> I have checked matching member, amount and unique reference in this fictional event.</label><div class="modal-actions">${btn('Cancel','closeModal()')}<button class="btn btn-primary">Reconcile example deposit</button></div></form>`)}
function resolveCollection(e,id){e.preventDefault();if(!requireOfficer('Treasurer'))return;const f=new FormData(e.target),evidence=String(f.get('evidence')||'');if(!evidence||!f.get('check'))return toast('Choose a simulated bank verification result',true);const n=ensureNigeria(),c=n.cases.find(x=>x.id===id);if(!c||['Resolved','Rejected'].includes(c.status))return toast('This reference was already processed',true);if(n.cases.some(x=>x.id!==id&&x.reference===c.reference&&x.status==='Resolved')||d().transactions.some(x=>x.memo===c.reference))return toast('Duplicate payment matching blocked',true);const m=mById(c.memberId);if(!m)return toast('Member unavailable',true);c.status='Resolved';c.evidence=evidence;c.reconciledAt=new Date().toLocaleString('en-GB');m.wallet+=c.amount;d().transactions.unshift({id:ident('TX'),memberId:m.id,type:'Reconciled collection · simulated',amount:c.amount,kind:'in',status:'Completed',date:today(),memo:c.reference});log(`Reconciled fictional settlement ${c.reference} with ${evidence}`,actorRole);save();closeModal();navigate('collections');toast('Demo wallet credited once from reconciled sample event')}
function rejectCase(id){if(!requireOfficer('Treasurer'))return;const c=ensureNigeria().cases.find(x=>x.id===id);if(!c||c.status==='Resolved')return;c.status='Rejected';c.note='Unverified claim rejected; no wallet balance credited. Member may raise a dispute.';log(`Rejected unverified collection ${c.reference}`,actorRole);save();render()}
function riskPage(){ensureNigeria();let loans=d().loans.filter(l=>l.status==='Disbursed'),m=d().members;let overdue=loans.filter(l=>l.remaining>0&&l.date<'2026-10-01');return `${header('Dues, arrears & loan recovery','Track missed dues, repayment obligations, guarantor exposure and possible hardship requests.','','THRIFT SCHEDULES & RISK')}${notice}<div class="ng-metrics"><div class="ng-metric"><small>Illustrative active loans</small><b>${loans.length}</b></div><div class="ng-metric"><small>Sample loans for review</small><b>${overdue.length}</b></div><div class="ng-metric"><small>Principal receivable</small><b>${fmt(loans.reduce((a,l)=>a+l.remaining,0))}</b></div></div><div class="ng-narrative"><b>Not all late payments are defaults.</b> A member may have a grace period, payroll deduction, cash payment awaiting reconciliation or an agreed repayment adjustment. This dashboard highlights cases for human review; it does not impose a penalty automatically.</div>${panel('Loan collections and arrears','Due dates below are illustrative; the loan terms and holidays must be configured from each cooperative’s bylaws.',loans.map(l=>{let mm=mById(l.memberId),due=l.date<'2026-10-01'?'12 Oct 2026':'Next approved due date';return `<div class="ng-case"><span class="glyph amber">${ico('clock')}</span><div class="ng-case-content"><strong>${E(mm?.name)} · ${fmt(l.remaining)} outstanding</strong> <span class="ng-tag warning">Review scheduled repayment</span><p>Loan ${E(l.id)} · ${l.term} months · example due: ${due}</p><p>Guarantor: ${E(l.guarantor)}. Amount excludes any interest, fines, insurance or fees. Configure calculations before production.</p><div class="ng-case-actions">${btn('Preview reminder',`previewReminder('${l.id}')`,'btn btn-xs btn-primary')}${btn('Review restructure',`openRestructure('${l.id}')`,'btn btn-xs')}</div></div></div>`}).join('')||'<p class="ng-empty">No outstanding disbursed loans in this sample workspace.</p>')}${panel('Daily / weekly / monthly thrift','A familiar plan schedule keeps member expectations clear',`<div class="ng-steps"><span class="ng-step">Daily thrift · agent-assisted or transfer</span><span class="ng-step">Weekly savings</span><span class="ng-step">Monthly payroll deduction</span><span class="ng-step">Locked fixed-term contributions</span><span class="ng-step">Loan principal, interest and charges separate</span><span class="ng-step">Paper receipts for offline members</span></div><div class="ng-notice">Illustrative arrears alerts do not trigger SMS, WhatsApp, credit bureau reporting or automatic debit. Production requires authorised schedules, consent, dispute review and any legally necessary lender approvals.</div>`)}`}
function previewReminder(id){let l=d().loans.find(x=>x.id===id);if(!l)return;const m=mById(l.memberId);modal('Preview of member reminder','No messages are sent from the prototype.',`<div class="faux-acct" style="background:#f5faf6;color:#325a49"><small>Draft SMS / WhatsApp, not sent</small><p>Good day ${E(m.name.split(' ')[0])}, this is a reminder to review your ${E(configs[org].short)} loan repayment schedule for ${E(l.id)}. For assistance, contact your cooperative office. Do not transfer funds to an unverified personal account.</p></div><div class="modal-actions">${btn('Close','closeModal()')}${btn('Log draft notice',`log('Draft reminder prepared for ${E(l.id)} — not sent');save();closeModal();toast('Reminder logged as unsent sample')`,'btn btn-primary')}</div>`)}
function openRestructure(id){let l=d().loans.find(x=>x.id===id);if(!l)return;modal('Repayment hardship & rescheduling','A member request is reviewed; changing repayment terms is not automatic.',`<p class="note">Loan ${E(id)} has ${fmt(l.remaining)} principal outstanding. Any reschedule needs the signed loan agreement, cooperative policy, authorised approval and revised schedule. Penalties, interest and guarantor rights are excluded from this prototype.</p><div class="modal-actions">${btn('Close','closeModal()')}${btn('Open review ticket',`createRiskTicket('${id}')`,'btn btn-primary')}</div>`)}
function createRiskTicket(id){if(!requireOfficer('Operations'))return;let l=d().loans.find(x=>x.id===id);if(!l)return;let n=ensureNigeria();n.tickets.unshift({id:ident('HLP'),memberId:l.memberId,type:'Loan hardship / reschedule',detail:`Review requested for ${l.id}. No automatic change to principal or terms.`,status:'Open',reply:'',created:today()});log(`Opened hardship review ticket for ${id}`,actorRole);save();closeModal();navigate('supportdesk')}
function supportDeskPage(){let n=ensureNigeria();return `${header('Member support & dispute resolution','Every complaint has a reference, a responsible officer and a review trail.',btn('Open member support view',"switchRole('member');navigate('myhelp')",'btn btn-primary','users'),'HELP DESK')}${notice}<div class="ng-narrative">A member with a missing payment, disputed balance, locked savings request, loan difficulty or account-access problem should have a visible case number. Sensitive KYC records must be kept out of chat screenshots and exports.</div>${panel('Member requests and complaints',`${n.tickets.length} case(s) · fictional examples`,n.tickets.map(t=>`<div class="ng-case"><span class="glyph">${ico('info')}</span><div class="ng-case-content"><strong>${E(t.type)} · ${E(t.id)}</strong> ${caseBadge(t)}<p>${E(mById(t.memberId)?.name)} · ${E(t.created)}</p><p>${E(t.detail)}</p>${t.reply?`<p><b>Officer response:</b> ${E(t.reply)}</p>`:''}<div class="ng-case-actions">${t.status!=='Resolved'?btn('Respond & resolve',`openTicketResponse('${t.id}')`,'btn btn-xs btn-primary'):''}</div></div></div>`).join('')||'<p class="ng-empty">No tickets yet.</p>')}${panel('Escalation paths','Examples of information the board will need to agree',`<div class="ng-steps"><span class="ng-step">Wrong balance</span><span class="ng-step">Wrong member credited</span><span class="ng-step">Lost paper receipt</span><span class="ng-step">Member exit & share refunds</span><span class="ng-step">Fraud / impersonation</span><span class="ng-step">Death & nominee claims</span><span class="ng-step">Account access lost</span><span class="ng-step">Joint / payroll deductions</span></div>`)}`}
function openTicketResponse(id){let t=ensureNigeria().tickets.find(x=>x.id===id);if(!t)return;modal('Respond to case '+E(id),'Only the cooperative’s authorised staff should resolve this in production.',`<form onsubmit="resolveTicket(event,'${E(id)}')"><div class="form-group"><label>Resolution note to member</label><textarea name="response" required minlength="12" rows="4" placeholder="State what was checked and the next steps...">${E(t.reply||'We have reviewed your request and will share the verified reconciliation outcome.')}</textarea></div><div class="form-group"><label>Outcome</label><select name="status"><option>In review</option><option>Resolved</option></select></div><div class="modal-actions">${btn('Cancel','closeModal()')}<button class="btn btn-primary">Save case response</button></div></form>`)}
function resolveTicket(e,id){e.preventDefault();if(!requireOfficer('Operations'))return;let t=ensureNigeria().tickets.find(x=>x.id===id);if(!t)return;let f=new FormData(e.target);t.reply=String(f.get('response')).trim();t.status=String(f.get('status'));if(t.reply.length<12)return toast('Please add a meaningful reply',true);log(`Support case ${id}: ${t.status}`,actorRole);save();closeModal();navigate('supportdesk')}
function myDuesPage(){ensureNigeria();let m=member(),l=d().loans.filter(l=>l.memberId===m.id&&l.status==='Disbursed');return `${header('My plans, dues & repayments','Know what is saved, what is due and what can actually be withdrawn.','','MEMBER FINANCIAL HEALTH')}${notice}<div class="ng-hero"><div><span class="ng-badge">MY CONTRIBUTIONS</span><h3>Clear records for every naira.</h3><p>For a member who pays weekly, saves for December or borrows for business, the next step should be obvious and understandable.</p></div>${btn('Make a contribution',`openAllocate('${m.id}')`,'btn btn-soft','coins')}</div><div class="ng-metrics"><div class="ng-metric"><small>Cooperative savings</small><b>${fmt(m.savings)}</b></div><div class="ng-metric"><small>Available internal wallet</small><b>${fmt(m.wallet)}</b></div><div class="ng-metric"><small>Share capital</small><b>${fmt(m.shares)}</b></div></div><div class="ng-separator"></div>${panel('Contribution plan','Your registered plan is controlled by cooperative policy',`<div class="ng-ledger-row"><span>Current plan</span><b>${E(m.plan)}</b></div><div class="ng-ledger-row"><span>Example weekly contribution</span><b>${fmt(d().settings.weekly)}</b></div><div class="ng-ledger-row"><span>Next scheduled payment</span><b>Confirm with cooperative</b></div><div class="ng-ledger-row"><span>Wallet withdrawals</span><b>Subject to available amount and approval</b></div><div class="ng-ledger-row"><span>Thrift / share redemption</span><b>Subject to bylaws; not instant cash-out</b></div><p class="ng-mini">No automatic late fee is charged in this prototype. Your cooperative’s approved schedule determines due dates, lock periods and penalties.</p>`)}<div class="ng-separator"></div>${panel('My loan repayments','Outstanding principal only; production must calculate contractual interest and schedule.',l.map(x=>`<div class="ng-case"><span class="glyph amber">${ico('loans')}</span><div class="ng-case-content"><strong>${E(x.id)} · ${fmt(x.remaining)} principal due</strong><p>Loan amount ${fmt(x.amount)} · ${x.term} months · ${E(x.purpose)}</p>${btn('Repay in demo',`openRepay('${x.id}')`,'btn btn-xs btn-primary')}${btn('Request hardship help',`openMemberTicket('Loan hardship / reschedule')`,'btn btn-xs')}</div></div>`).join('')||'<div class="ng-empty">No active loan on this sample member profile.</div>')}${panel('Need help?', 'Members without smartphones can receive office-assisted records',`${btn('Report missing payment',"openMemberTicket('Missing payment')",'btn btn-soft','info')} ${btn('Request member exit review',"openMemberTicket('Membership exit / refund')",'btn','users')}`)}`}
function myHelpPage(){let n=ensureNigeria(),mine=n.tickets.filter(t=>t.memberId===member().id);return `${header('Get help from my cooperative','Raise a payment dispute, request an exit review or ask about repayment hardship.',btn('New support request',"openMemberTicket('Savings balance dispute')",'btn btn-primary','plus'),'MEMBER SUPPORT')}${notice}<div class="ng-hero"><div><span class="ng-badge">MEMBER-FIRST SERVICE</span><h3>Questions deserve answers.</h3><p>A support request produces a case reference. You can review staff responses here. No real email, SMS or WhatsApp message is sent.</p></div></div><div class="ng-cards">${[['Missing payment','Transfer missing from balance'],['Savings balance dispute','Disagree with contribution figures'],['Loan hardship / reschedule','Need support with loan repayment'],['Membership exit / refund','Request bylaw-based withdrawal of shares'],['Access or impersonation','Lost phone or unrecognised activity'],['Nominee / deceased member','Ask for human review of nominee claim']].map(([type,description])=>`<div class="ng-card"><span class="glyph">${ico('info')}</span><h4>${E(type)}</h4><p>${E(description)}</p>${btn('Open request',`openMemberTicket('${E(type)}')`,'btn btn-xs btn-primary')}</div>`).join('')}</div>${panel('My submitted cases','Staff review, member follow-up and resolution history',mine.map(t=>`<div class="ng-case"><span class="glyph">${ico('report')}</span><div class="ng-case-content"><strong>${E(t.type)} · ${E(t.id)}</strong> ${caseBadge(t)}<p>${E(t.detail)}</p>${t.reply?`<p><b>Officer reply:</b> ${E(t.reply)}</p>`:''}</div></div>`).join('')||'<div class="ng-empty">No member requests in this sample account.</div>')}`}
function openMemberTicket(type){if(role!=='member')return toast('Switch to member view',true);modal('Create cooperative support request','This demo opens a local case for management to review.',`<form onsubmit="submitMemberTicket(event)"><div class="form-group"><label>Request type</label><select name="type">${[type,'Missing payment','Savings balance dispute','Loan hardship / reschedule','Membership exit / refund','Access or impersonation','Nominee / deceased member'].filter((x,i,a)=>a.indexOf(x)===i).map(x=>`<option>${E(x)}</option>`).join('')}</select></div><div class="form-group"><label>What happened? (do not include bank PIN or BVN)</label><textarea name="detail" required rows="4" minlength="12" maxlength="500" placeholder="Describe the transaction date, sample receipt reference or issue...">I would like the cooperative office to review my account and advise the next steps.</textarea></div><div class="modal-actions">${btn('Cancel','closeModal()')}<button class="btn btn-primary">Submit request</button></div></form>`)}
function submitMemberTicket(e){e.preventDefault();if(role!=='member')return;let f=new FormData(e.target),type=String(f.get('type')),detail=String(f.get('detail')||'').trim();if(detail.length<12)return toast('Please describe the issue',true);let n=ensureNigeria();n.tickets.unshift({id:ident('HLP'),memberId:member().id,type,detail,status:'Open',reply:'',created:today()});log(`Member opened support case ${type}`,'Demo member');save();closeModal();navigate('myhelp');toast('Request submitted. Case appears in manager help desk.')}


function paystackDeskPage(){const p=psPayments(),paid=p.filter(x=>x.status==='Completed'),pending=p.filter(x=>x.status==='Paid · awaiting verification').length,failed=p.filter(x=>x.status==='Failed').length;return `${header('Paystack payments','Mobile-friendly payment operations, verified ledger posting, exceptions and member service fees.',btn('Create test checkout',"startPaystack()",'btn btn-primary','plus'),'PAYMENT OPERATIONS')}${notice}<div class="ng-metrics">${stat('Verified payments',paid.length,'Confirmed mock provider events','check')}${stat('Awaiting verification',pending,'Never credit before verification','clock','amber')}${stat('Failed payments',failed,'Safe retry, no ledger movement','shield','rose')}</div>${panel('Payment operations','Try pending → successful checkout → verified webhook; failed and duplicate scenarios are also testable.',`<div class="ps-info">🔒 Production requires server-initialized transactions, a verified Paystack success status and amount (kobo), signed webhooks, idempotent entries and a reconciled bank settlement. No live Paystack API is connected.</div><div class="ps-ledger">${p.map(r=>`<div class="ps-payment"><div><b>${E(mById(r.memberId)?.name||r.memberId)}</b><small>${E(r.id)} · ${r.purpose==='membership'?'₦500 platform fee':'Wallet top-up'} · ${E(r.channel)}</small><div style="margin-top:6px">${badge(r.status)}</div></div><div class="ps-payment-right"><b>${fmt(r.amount)}</b>${btn('Details',`showPaystackReceipt('${r.id}')`,'btn btn-xs')}${r.status==='Paid · awaiting verification'?btn('Verify demo event',`verifyPaystackDemo('${r.id}')`,'btn btn-xs btn-primary'):''}</div></div>`).join('')||'<div class="ng-empty">No Paystack demo payments yet. Create a test checkout to begin.</div>'}</div>`)}<div class="two-col" style="margin-top:16px">${panel('Try a ₦500 member subscription','Membership service fee and cooperative revenue proposal',`${btn('Simulate ₦500 platform payment',"startPaystack('', 'membership', 500)",'btn btn-primary','plus')}<p class="note" style="margin-top:12px">Cooperative share proposed at ₦200–₦300 per paid member per month. A split must be agreed, configured, reconciled, and account for transaction charges; no automatic payout takes place in this demo.</p>`)}${panel('Production control checklist','What would need to be deployed',`<div class="ng-steps"><span class="ng-step">Paystack test & live keys server-side</span><span class="ng-step">Server transaction initialization</span><span class="ng-step">Verified webhooks</span><span class="ng-step">Reference / amount checks</span><span class="ng-step">Idempotent ledger</span><span class="ng-step">Chargebacks and refunds</span><span class="ng-step">Partner settlement agreements</span></div>`)}</div>`}
function memberPaystackPage(){const m=member(),p=psPayments().filter(x=>x.memberId===m.id);const rows=p.map(r=>`<div class="ps-payment"><div><b>${r.purpose==='membership'?'Monthly service fee':'Cooperative wallet top-up'}</b><small>${E(r.id)} · ${E(r.date)}</small><div style="margin-top:5px">${badge(r.status)}</div></div><div class="ps-payment-right"><b>${fmt(r.amount)}</b>${btn('View',`showPaystackReceipt('${r.id}')`,'btn btn-xs')}</div></div>`).join('')||'<p class="note">No payments yet. Tap Fund wallet to begin the demo.</p>';return `${header('Pay with Paystack','Pay your monthly service fee or fund the cooperative ledger with a realistic test checkout.',btn('Pay / top up',`startPaystack('${m.id}')`,'btn btn-primary','plus'),'MEMBER PAYMENTS')}${notice}<div class="member-hero"><div><span class="ng-badge">PAYSTACK-STYLE SIMULATION</span><h2>${fmt(m.wallet)}</h2><p>Available cooperative ledger · not a bank balance</p></div><span style="font-size:36px">↗</span></div><div class="ps-tile-grid"><button class="ps-tile" onclick="startPaystack('${m.id}','wallet',20000)"><span>💳</span><b>Fund wallet</b><small>Card · bank transfer · USSD</small></button><button class="ps-tile" onclick="startPaystack('${m.id}','membership',500)"><span>🪪</span><b>₦500 monthly fee</b><small>Member platform subscription</small></button></div>${panel('Payment history','Unique transaction references and status.',rows+'<div class="ps-info" style="margin-top:14px">A checkout success alone is not proof of settlement. The server must verify the transaction before crediting an account.</div>')}`}
function mobileNav(){const items=role==='member'?[['home','Home','dashboard'],['mypayments','Pay','wallet'],['mysavings','Savings','coins'],['myloans','Loans','loans']]:[['overview','Home','dashboard'],['paystack','Payments','wallet'],['members','Members','users'],['approvals','Approvals','check']];return `<nav class="bottom-tabs" aria-label="Mobile quick navigation">${items.map(([id,label,ic])=>`<button class="${page===id?'active':''}" onclick="navigate('${id}')">${ico(ic,20)}<span>${label}</span></button>`).join('')}<button onclick="drawer=true;render()">${ico('menu',20)}<span>More</span></button></nav>`}

render();
</script>
</body>
</html>
