<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Opening WhatsApp…</title><style>body{font-family:system-ui,-apple-system,sans-serif;background:#f8fafc;color:#0f172a;display:grid;place-items:center;min-height:100vh;margin:0}.box{max-width:560px;padding:28px;border:1px solid #e2e8f0;border-radius:22px;background:#fff;box-shadow:0 10px 30px rgba(15,23,42,.08)}a{color:#0f766e;font-weight:800}</style></head><body><div class="box" id="status">Preparing your WhatsApp message…</div><script src="/p1.js"></script><script src="/p2.js"></script><script src="/p3.js"></script><script src="/p4.js"></script><script>const P=[...P1,...P2,...P3,...P4],slug=new URLSearchParams(location.search).get('p'),x=P.find(v=>v[1]===slug),box=document.getElementById('status');function greet(){let h=new Date().getHours();return h<12?'Good morning sir/ma,':h<17?'Good afternoon sir/ma,':'Good evening sir/ma,'}if(!x){box.innerHTML='Prospect not found. <a href="/">Return to dashboard</a>'}else{const name=x[0],category=x[2],city=x[3],description=x[7],wa=x[8],site=location.origin+'/'+x[1]+'/';const text=`${greet()}\n\nI came across ${name} online and saw that you offer ${description.toLowerCase()}. I took the liberty of putting together a complimentary website concept specifically for your business, using the services and location information I could find publicly.\n\nHere’s the sample:\n${site}\n\nI designed it around your ${category.toLowerCase()} services in ${city} to show another way your business could be presented online. If you like the direction, I can customise it properly with your real photos, logo, products/services, domain name and direct WhatsApp enquiries or ordering.\n\nThank you for your time, sir/ma.`;const u='https://wa.me/'+wa+'?text='+encodeURIComponent(text);box.innerHTML='<b>'+name+'</b><p>Opening WhatsApp with the customised message and website link…</p><p><a id="go" href="'+u+'">Tap here if WhatsApp does not open automatically</a></p>';setTimeout(()=>location.href=u,250)}}</script></body></html>
